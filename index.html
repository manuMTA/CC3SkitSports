<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC3S Kit Triathlon — suivi coach & athlètes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202b; --muted:#5d6b7a; --line:#dfe5eb; --bg:#f4f6f8; --card:#fff; --accent:#0f5c8c;
  --swim:#1f7fbf; --swim-bg:#e3f1fb; --bike:#d9822b; --bike-bg:#fdf0e2;
  --run:#2f9461; --run-bg:#e2f4ea; --strength:#7c4dcc; --strength-bg:#efe8fb;
  --z1:#7cc4a4; --z2:#f2c14e; --z3:#e2654f; --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
h1,h2,h3,.brand{font-family:"Barlow Semi Condensed",Inter,sans-serif;letter-spacing:.2px}
h2{font-size:1.5rem;margin:0}
h3{font-size:1.15rem;margin:0 0 .5rem}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.topbar{background:var(--ink);color:#fff}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{font-size:1.35rem;font-weight:700}
.brand span{color:#7cc4f0}
.spacer{flex:1}
.who{font-size:.9rem;opacity:.85}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;color:var(--ink)}
.btn:hover{border-color:#b8c4cf}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0b4b73}
.btn.ghost{background:transparent;border-color:transparent;color:inherit}
.btn.dark{background:transparent;border-color:#3a4a5a;color:#fff}
.btn.danger{color:#b3261e;border-color:#f0c9c6}
.btn.sm{padding:4px 9px;font-size:.85rem}
.notice{background:#fff7e0;border:1px solid #f0dd9c;color:#6b5513;border-radius:8px;padding:8px 12px;font-size:.85rem;margin-bottom:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 16px;flex-wrap:wrap}
.tab{border:0;background:none;padding:10px 14px;color:var(--muted);border-bottom:3px solid transparent;font-weight:500}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.weeknav .label{font-weight:600;min-width:220px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.crumb{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--muted)}
.crumb b{color:var(--ink);font-size:1.25rem;font-family:"Barlow Semi Condensed"}

/* Agenda */
.agenda{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{background:#fff;border:1px solid var(--line);border-radius:var(--radius);min-height:220px;display:flex;flex-direction:column}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dayhead{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.dayhead b{font-family:"Barlow Semi Condensed";font-size:1.05rem}
.dayhead small{color:var(--muted)}
.daybody{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.sess{border:0;text-align:left;border-radius:8px;padding:8px 9px;border-left:5px solid;width:100%}
.sess .sp{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.sess .tt{font-weight:600;margin:2px 0;line-height:1.25}
.sess .meta{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.sess:hover{filter:brightness(.97)}
.done{color:var(--run);font-weight:600}
.off{color:#9aa6b2;font-style:italic;font-size:.85rem;text-align:center;margin:auto 0}
.add{border:1px dashed #c5ced7;background:none;border-radius:8px;padding:6px;color:var(--muted);font-size:.85rem;margin-top:auto}
.add:hover{color:var(--accent);border-color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:.85rem;color:var(--muted)}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Tables */
table.grid{border-collapse:collapse;width:100%;background:#fff}
table.grid th,table.grid td{border:1px solid var(--line);padding:9px 10px;text-align:center}
table.grid thead th{background:#eef2f5;font-weight:600;font-size:.9rem}
table.grid tbody th{text-align:left;font-weight:600;width:110px}
table.grid tfoot td,table.grid tfoot th{background:#eef2f5;font-weight:700}
table.grid td.tot{font-weight:600;background:#f7f9fa}
.zchip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.8rem;font-weight:700;color:#1d2a36}
.zZ1{background:var(--z1)}.zZ2{background:var(--z2)}.zZ3{background:var(--z3);color:#fff}
.scroll{overflow-x:auto}
.kpis{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;min-width:180px}
.kpi small{color:var(--muted);display:block;margin-bottom:2px}
.kpi b{font-family:"Barlow Semi Condensed";font-size:1.9rem}
/* Vue synthétique */
.synth{display:grid;grid-template-columns:minmax(0,560px) minmax(200px,260px);gap:12px;align-items:start}
table.cmp{border-collapse:separate;border-spacing:2px;width:100%;font-size:.85rem;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:6px}
table.cmp th,table.cmp td{padding:5px 6px;text-align:center;border-radius:5px;white-space:nowrap}
table.cmp thead th{font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
table.cmp tbody th{text-align:left;width:44px}
table.cmp td.e{color:#c3ccd5}
table.cmp td.t,table.cmp tfoot td{font-weight:700}
table.cmp tfoot th{text-align:left;font-size:.75rem;color:var(--muted);font-weight:600}
.side{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px}
.side .l{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid #eef2f5;font-size:.85rem;color:var(--muted)}
.side .l:last-child{border-bottom:0}
.side .l b{color:var(--ink);font-family:"Barlow Semi Condensed";font-size:1.25rem}
.side .l.big b{font-size:1.6rem}
.wk{display:grid;grid-template-columns:105px 1fr 58px 44px;gap:8px;align-items:center;font-size:.82rem;padding:3px 0}
.wk .bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:#eef2f5}
.wk .bar div{height:100%}
.wk .n{text-align:right;font-weight:700}
.wk .o{text-align:right;color:var(--muted)}
.wkhead{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.4px}
.sect{font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin:16px 0 6px}
@media (max-width:760px){.synth{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 12px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}

/* Séance */
.shead{display:grid;grid-template-columns:1fr 160px 170px;gap:10px;margin-bottom:6px}
.field label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:3px;font-weight:500}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 9px;background:#fff}
.block{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.bhead{display:flex;gap:10px;align-items:center;padding:10px 12px;background:#f7f9fa;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bnum{font-family:"Barlow Semi Condensed";font-weight:700;color:var(--muted)}
.bhead input.bt{flex:1;min-width:160px;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-weight:600}
.reps{display:flex;align-items:center;gap:5px}
.reps input{width:62px;border:1px solid var(--line);border-radius:7px;padding:7px;text-align:center;font-weight:600}
.bdur{font-size:.85rem;color:var(--muted);min-width:90px;text-align:right}
table.steps{border-collapse:collapse;width:100%;min-width:760px}
table.steps th{font-size:.75rem;color:var(--muted);font-weight:600;text-align:left;padding:7px 6px 3px}
table.steps td{padding:3px 4px}
table.steps input,table.steps select{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 7px;background:#fff}
table.steps tr td:first-child{padding-left:10px}
.bfoot{padding:6px 10px 10px}
.summary{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.summary .big{font-family:"Barlow Semi Condensed";font-size:1.6rem;font-weight:700}
.zbar{display:flex;height:10px;border-radius:5px;overflow:hidden;min-width:200px;flex:1;background:#eef2f5}
.zbar div{height:100%}
.ztxt{font-size:.85rem;color:var(--muted)}
table.grid input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 7px;text-align:center;background:#fff}
.rpe{display:flex;gap:5px;flex-wrap:wrap}
.rpe button{width:38px;height:36px;border-radius:7px;border:1px solid var(--line);background:#fff;font-weight:600}
.rpe button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Coach */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ath{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;width:100%}
.ath:hover{border-color:var(--accent)}
.ath h3{font-size:1.3rem;margin-bottom:6px}
.minibar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#eef2f5;margin:10px 0 6px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;margin-right:8px}

/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#16202b 0%,#0f5c8c 100%)}
.login .card{width:100%;max-width:380px;padding:28px}
.login h1{margin:0 0 4px;font-size:1.9rem}
.login p{color:var(--muted);margin:0 0 18px;font-size:.9rem}
.login .field{margin-bottom:12px}
.err{color:#b3261e;font-size:.88rem;min-height:1.2em;margin-bottom:8px}
.demo{margin-top:16px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;line-height:1.6}
.demo code{background:#eef2f5;padding:1px 5px;border-radius:4px}

.sbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px;border:0;border-radius:8px;background:#fc4c02;color:#fff;font-weight:600}
.sbtn:hover{background:#e04300}
.or{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.8rem;margin:14px 0}
.or:before,.or:after{content:'';flex:1;height:1px;background:var(--line)}
.ltabs{display:flex;gap:4px;margin-bottom:10px}
.ltabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px;font-size:.85rem}
.ltabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.msg{font-size:.85rem;color:var(--run);min-height:1.2em;margin-bottom:8px}
.badge{background:#fc4c02;color:#fff;border-radius:10px;padding:0 6px;font-size:.72rem;margin-left:4px}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.pwrd{font-size:.68rem;color:var(--muted);text-align:center;margin-top:14px}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(22,32,43,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:#fff;border-radius:12px;padding:20px;max-width:420px;width:100%}
.modal.wide{max-width:600px}
.tplq{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;margin:6px 0;font-size:.85rem}
.tpllist{max-height:300px;overflow:auto;border:1px solid #eef2f5;border-radius:8px}
.tpli{display:grid;grid-template-columns:22px minmax(0,1fr) 48px 90px;gap:8px;align-items:center;width:100%;border:0;border-bottom:1px solid #f1f4f6;background:#fff;text-align:left;padding:7px 9px;font-size:.82rem;cursor:pointer}
.tpli:hover{background:#f4f8fb}
.tpli .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpli .ds{color:var(--muted);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpli .lgraph{width:90px}
.ichips{display:flex;gap:4px;flex-wrap:wrap}
.ichips span{padding:0 5px;border-radius:4px;font-size:.7rem;font-weight:600;color:#1d2a36}
.sportpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.sportpick button{border:0;border-left:6px solid;border-radius:8px;padding:14px;font-weight:600;text-align:left}


/* ===== Page semaine condensée ===== */
body{font-size:14px}
.wrap{padding:10px 12px}
.topbar .wrap{padding-top:6px;padding-bottom:6px}
.brand{font-size:1.15rem}
.notice{padding:4px 10px;font-size:.75rem;margin-bottom:8px}
.tabs{margin:6px 0 8px}
.tab{padding:6px 10px;font-size:.88rem}
.weeknav{margin-bottom:8px;gap:6px}
.weeknav .label{min-width:200px;font-size:.9rem}
.crumb b{font-size:1.1rem}
h2{font-size:1.25rem}
.ag{display:grid;grid-template-columns:repeat(7,minmax(108px,1fr));gap:4px;overflow-x:auto;padding-bottom:2px}
.d2{background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:84px}
.d2.today{border-color:var(--accent)}
.d2 .h{display:flex;justify-content:space-between;align-items:center;padding:3px 4px 3px 7px;border-bottom:1px solid #eef2f5;font-size:.78rem;font-weight:600}
.d2 .h button{border:0;background:none;color:var(--muted);font-size:1rem;line-height:1;padding:0 4px;border-radius:4px}
.d2 .h button:hover{background:#eef2f5;color:var(--accent)}
.d2 .b{padding:4px;display:flex;flex-direction:column;gap:3px}
.c2{border:0;border-left:4px solid;border-radius:5px;padding:3px 5px;text-align:left;font-size:.75rem;line-height:1.25;width:100%}
.c2 .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c2 .m{display:flex;justify-content:space-between;color:var(--muted);font-size:.7rem}
.c2.sel{outline:2px solid var(--ink);outline-offset:-1px}
.c2{cursor:pointer;position:relative}
.c2 .t{padding-right:20px}
.vchk{position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:4px;border:1.5px solid #9aa6b2;background:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;line-height:1;color:transparent;cursor:pointer}
.vchk:hover{border-color:var(--run);color:var(--run)}
.vchk.on{background:var(--run);border-color:var(--run);color:#fff}
.c2.todo .m > span:first-child:after{content:' · à valider';color:#b26a00}
.vbtn{width:100%;margin-top:8px;padding:8px;border:0;border-radius:7px;background:var(--run);color:#fff;font-weight:600;font-size:.85rem;cursor:pointer}
.vbtn:hover{filter:brightness(.93)}
.vok{margin-top:8px;padding:6px 8px;border-radius:7px;background:#e2f4ea;color:var(--run);font-size:.8rem;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.vok button{border:0;background:none;color:var(--muted);font-size:.75rem;text-decoration:underline;cursor:pointer}
.pre{font-size:.7rem;color:#b26a00;margin:0 0 4px}
.d2 .off{font-size:.72rem;margin:6px 0}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:8px;margin-top:8px;align-items:start}
.pane{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
.pane h4{margin:0 0 6px;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.dense input,.dense select,.dense textarea{font-size:.8rem;border:1px solid var(--line);border-radius:5px;padding:3px 5px;background:#fff;width:100%}
.dense input:disabled,.dense select:disabled,.dense textarea:disabled{background:#f7f9fa}
.shrow{display:flex;gap:5px;align-items:center;margin-bottom:6px}
.shrow .ti{flex:1;font-weight:600;font-size:.9rem!important}
.shrow select{width:auto;font-weight:600}
.shrow input[type=date]{width:auto}
.ib{border:0;background:none;color:var(--muted);padding:2px 5px;border-radius:4px;font-size:.85rem}
.ib:hover{background:#eef2f5;color:var(--ink)}
.ib.red:hover{color:#b3261e}
.sline{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted);margin-bottom:6px}
.sline b{color:var(--ink);font-size:.95rem}
.sline .zbar{height:6px;min-width:80px}
.blk{border:1px solid #e8edf1;border-radius:6px;margin-bottom:5px}
.blk .bh{display:flex;gap:4px;align-items:center;padding:3px 4px;background:#f7f9fa;border-bottom:1px solid #e8edf1}
.blk .bh .n{font-size:.7rem;font-weight:700;color:var(--muted);padding:0 3px}
.blk .bh .bt{flex:1;font-weight:600}
.blk .bh .rp{width:42px!important;text-align:center}
.blk .bh .du{font-size:.72rem;color:var(--muted);min-width:44px;text-align:right}
table.st{border-collapse:collapse;width:100%;min-width:820px}
table.st th{font-size:.65rem;color:var(--muted);font-weight:600;text-align:left;padding:2px 3px 0;text-transform:uppercase}
table.st td{padding:1px 2px}
table.st th.cons{min-width:170px}
.sinfo{font-size:.76rem;color:var(--ink);line-height:1.6;display:block;max-width:290px}
.sinfo .nw{white-space:nowrap}
table.st th:first-child{min-width:150px}
.sinfo i{font-style:normal;color:#b8c4cf;margin:0 1px}
.sinfo b{font-weight:600;color:var(--accent)}
table.st td:has(input[data-k="autre"]) input{width:100%!important;min-width:170px}
table.st tr td:first-child,table.st tr th:first-child{padding-left:4px}
.lk{border:0;background:none;color:var(--accent);font-size:.75rem;padding:2px 4px}
.lk:hover{text-decoration:underline}
table.bz{border-collapse:collapse;width:100%}
table.bz th{font-size:.65rem;color:var(--muted);text-transform:uppercase;font-weight:600;padding:2px;text-align:left}
table.bz td{padding:1px 2px}
table.bz tfoot td{font-size:.8rem;font-weight:700;padding:3px 2px}
.rp10{display:flex;gap:2px;margin:3px 0 6px}
.rp10 button{flex:1;height:24px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:.72rem;font-weight:600;padding:0}
.rp10 button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lab{font-size:.68rem;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:6px}
.empty{color:var(--muted);font-size:.85rem;padding:14px;text-align:center}
.c2[draggable=true]{cursor:grab}
.c2.dragging{opacity:.4}
.d2.over{border-color:var(--accent);background:#eaf4fb;box-shadow:0 0 0 2px var(--accent) inset}
.hint{font-size:.7rem;color:var(--muted);margin-top:3px}
/* Bibliothèque */
.filt{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.filt button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 10px;font-size:.78rem;font-weight:600;color:var(--muted)}
.filt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.8rem}
.pcard b{font-size:.9rem}
.pcard .d{color:var(--muted);margin:3px 0 5px;line-height:1.35}
.dots{display:flex;gap:2px;margin:3px 0 6px}
.dots span{flex:1;height:6px;border-radius:2px;background:#eef2f5}
.act{display:flex;gap:4px;align-items:center}
.act input{width:auto!important;font-size:.75rem!important;padding:2px 4px!important}

<body>
<div id="app"></div>
<div id="modal"></div>
<script>
/* ===================== Constantes ===================== */
const SPORTS = {
  swim:     {label:'Natation', color:'var(--swim)',     bg:'var(--swim-bg)'},
  bike:     {label:'Vélo',     color:'var(--bike)',     bg:'var(--bike-bg)'},
  run:      {label:'CAP',      color:'var(--run)',      bg:'var(--run-bg)'},
  strength: {label:'Renfo',    color:'var(--strength)', bg:'var(--strength-bg)'}
};
const SPORT_KEYS = Object.keys(SPORTS);
const SPORT_ICONS = {
  swim: '<circle cx="17" cy="6.5" r="2"/><path d="M3 12.5l5-3 4 2.2 3.5-3.2"/><path d="M2 17.5c2 0 2-1.4 4-1.4s2 1.4 4 1.4 2-1.4 4-1.4 2 1.4 4 1.4 2-1.4 4-1.4"/><path d="M2 21c2 0 2-1.4 4-1.4s2 1.4 4 1.4 2-1.4 4-1.4 2 1.4 4 1.4 2-1.4 4-1.4"/>',
  bike: '<circle cx="5.5" cy="16.5" r="3.8"/><circle cx="18.5" cy="16.5" r="3.8"/><path d="M5.5 16.5l3.5-7h6l3.5 7M9 9.5L7.8 6H6M15 9.5l-3.2 7H5.5"/><path d="M14 6h2.5"/>',
  run: '<circle cx="15" cy="4" r="2"/><path d="M8.5 21l2.5-5.5 3 2.5v4.5"/><path d="M11 15.5l1.8-6.5 3.7 3.2 3-1"/><path d="M12.8 9L8.7 9.8 6.8 13"/>',
  strength: '<path d="M3.5 9.5v5M6.5 7v10M17.5 7v10M20.5 9.5v5M6.5 12h11"/>'
};
const icon = (k, size=14, color='currentColor') => `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SPORT_ICONS[k]||''}</svg>`;
const ZONES = ['Z1','Z2','Z3'];
const DAYS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MONTHS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

/* ===================== Utilitaires ===================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : uid() + uid());
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function mondayOf(s){ const d = parseYmd(s); const wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd); return ymd(d); }
const todayStr = () => ymd(new Date());
function weekLabel(ws){
  const a = parseYmd(ws), b = parseYmd(addDays(ws,6));
  return a.getMonth() === b.getMonth()
    ? `Semaine du ${a.getDate()} au ${b.getDate()} ${MONTHS[b.getMonth()]} ${b.getFullYear()}`
    : `Semaine du ${a.getDate()} ${MONTHS[a.getMonth()]} au ${b.getDate()} ${MONTHS[b.getMonth()]} ${b.getFullYear()}`;
}
function longDate(s){ const d = parseYmd(s); return ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'][d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }

/* Durées : "45" = 45 min ; "3:30" = 3 min 30 s (étapes) ou 3 h 30 (bilans) ; "1:30:00" = h:mm:ss */
function parseMS(v){
  v = String(v||'').trim().replace(',', '.'); if (!v) return 0;
  const p = v.split(':').map(Number); if (p.some(isNaN)) return 0;
  if (p.length === 1) return Math.round(p[0]*60);
  if (p.length === 2) return p[0]*60 + p[1];
  return p[0]*3600 + p[1]*60 + p[2];
}
function parseHM(v){
  v = String(v||'').trim().toLowerCase().replace('h', ':').replace(',', '.'); if (!v) return 0;
  if (v.endsWith(':')) v += '0';
  const p = v.split(':').map(Number); if (p.some(isNaN)) return 0;
  if (p.length === 1) return Math.round(p[0]*60);
  if (p.length === 2) return p[0]*3600 + p[1]*60;
  return p[0]*3600 + p[1]*60 + p[2];
}
function fmt(sec){
  sec = Math.round(sec||0); if (!sec) return '—';
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if (h) return h + 'h' + String(m).padStart(2,'0');
  return m + ' min' + (s ? ' ' + String(s).padStart(2,'0') + 's' : '');
}

/* ===================== Données ===================== */
let state, me = null;
const ui = { view:'home', athleteId:null, sessionId:null, week:mondayOf(todayStr()), tab:'agenda', stab:'prevu', mode:'realise', month:todayStr().slice(0,7) };

/* ===== Échelle d'intensité I1 à I7 (taux en % de la valeur de référence) =====
   CAP : % de la VMA · Vélo : % de la PMA seuil (FTP) · Natation : % de la vitesse au seuil (CSS) · FC : % de la FC seuil */
const INTS = [
  {k:'I1', n:'Récupération',            z:'Z1', run:[50,60],   bike:[0,55],    swim:[0,80],    hr:[0,75],     c:'#cfeee0'},
  {k:'I2', n:'Endurance fondamentale',  z:'Z1', run:[60,75],   bike:[56,75],   swim:[80,88],   hr:[75,85],    c:'#9ddcc0'},
  {k:'I3', n:'Endurance active (tempo)',z:'Z2', run:[75,80],   bike:[76,90],   swim:[88,95],   hr:[85,92],    c:'#f8df9a'},
  {k:'I4', n:'Seuil',                   z:'Z2', run:[80,90],   bike:[91,105],  swim:[95,102],  hr:[92,100],   c:'#f2c14e'},
  {k:'I5', n:'PMA / VMA longue',        z:'Z3', run:[90,100],  bike:[106,120], swim:[102,108], hr:[100,106],  c:'#f0a080'},
  {k:'I6', n:'VMA courte / anaérobie',  z:'Z3', run:[100,115], bike:[121,150], swim:[108,115], hr:[106,null], c:'#e2654f'},
  {k:'I7', n:'Sprint / force max',      z:'Z3', run:[115,null],bike:[150,null],swim:[115,null],hr:null,       c:'#b83a2a'}
];
const INT_BY = Object.fromEntries(INTS.map(i => [i.k, i]));
const INT_SHORT = {I1:'Récup', I2:'Endurance', I3:'Tempo', I4:'Seuil', I5:'PMA / VMA', I6:'VMA courte', I7:'Sprint'};
// Intensité déduite pour une ligne qui n'en a pas (anciennes séances en Z1/Z2/Z3)
function defaultInt(st, b){
  const rec = /récup|trot|souple|repos/i.test(st.autre || '') || /retour|calme|récup/i.test((b && b.title) || '');
  const wu = /échauffement/i.test((b && b.title) || '');
  return rec ? 'I1' : wu ? 'I2' : ({Z1:'I2', Z2:'I4', Z3:'I5'}[st.zone] || 'I2');
}
function ensureInts(s){
  let ch = false;
  s.blocks.forEach(b => b.steps.forEach(st => { if (!st.int){ setStepInt(st, defaultInt(st, b)); ch = true; } }));
  return ch;
}
const ZONE_INTS = {Z1:['I1','I2'], Z2:['I3','I4'], Z3:['I5','I6','I7']};
const mmss = sec => { sec = Math.round(sec); return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); };
function getParams(u){
  if (!u) return {};
  u.params = u.params || {};
  ['run','bike','swim'].forEach(k => u.params[k] = u.params[k] || {});
  return u.params;
}
// FC seuil de référence d'un sport (saisie, sinon estimée à 90 % de la FC max)
function fcSeuil(u, sport){
  const p = getParams(u)[sport] || {};
  if (+p.fcs > 0) return {v:+p.fcs, est:false, max:+p.fcmax || null};
  if (+p.fcmax > 0) return {v:Math.round(+p.fcmax*0.9), est:true, max:+p.fcmax};
  return null;
}
function refOf(u, sport){
  const p = getParams(u)[sport] || {};
  if (sport === 'run' && +String(p.vma).replace(',','.') > 0) return +String(p.vma).replace(',','.');
  if (sport === 'bike' && +p.ftp > 0) return +p.ftp;
  if (sport === 'swim' && parseMS(p.css) > 0) return parseMS(p.css) / 60 * 60; // secondes / 100 m (« 1:45 » = 105 s)
  return null;
}
// Texte de cible pour une intensité : allure (CAP, natation) ou puissance (vélo)
function rangeTxt(sport, ref, pr){
  if (!ref || !pr) return '';
  const [lo, hi] = pr;
  if (sport === 'bike'){
    const w = x => Math.round(ref*x/100);
    return !lo ? `< ${w(hi)} W` : hi == null ? `> ${w(lo)} W` : `${w(lo)}–${w(hi)} W`;
  }
  if (sport === 'run'){
    const pace = x => mmss(3600 / (ref*x/100));
    return !lo ? `> ${pace(hi)}/km` : hi == null ? `< ${pace(lo)}/km` : `${pace(lo)}–${pace(hi)}/km`;
  }
  if (sport === 'swim'){
    const pace = x => mmss(ref / (x/100));
    return !lo ? `> ${pace(hi)}/100 m` : hi == null ? `< ${pace(lo)}/100 m` : `${pace(lo)}–${pace(hi)}/100 m`;
  }
  return '';
}
function hrTxt(f, pr){
  if (!f || !pr) return '';
  const [lo, hi] = pr, b = x => Math.round(f.v*x/100), cap = x => f.max ? Math.min(x, f.max) : x;
  return !lo ? `< ${b(hi)} bpm` : hi == null ? `> ${cap(b(lo))} bpm` : `${cap(b(lo))}–${cap(b(hi))} bpm`;
}
// Cible d'une ligne de séance selon l'intensité choisie et le profil de l'athlète
function stepTarget(st, sport, u){
  if (!st.int || !INT_BY[st.int] || sport === 'strength') return null;
  const it = INT_BY[st.int];
  return {pace: rangeTxt(sport, refOf(u, sport), it[sport]), hr: hrTxt(fcSeuil(u, sport), it.hr)};
}
function zoneRange(sport, key, ints){ // fusionne les bornes des intensités d'une zone
  const prs = ints.map(k => INT_BY[k][key]).filter(Boolean);
  if (!prs.length) return null;
  return [prs[0][0], prs[prs.length-1][1]];
}
// Limites FC Z1/Z2 utilisées pour classer les activités importées
function hrLimits(u, sport){
  const f = fcSeuil(u, sport);
  if (f) return {z1: Math.round(f.v*0.85), z2: Math.round(f.v)};
  return u.hr || {z1:145, z2:165};
}
/* ===== Critère de série : intensité, % VMA/PMA/vitesse seuil, RPE ou FC ===== */
const PCT_LAB = {run:'% VMA', bike:'% PMA', swim:'% vit. seuil'};
const PACE_LAB = {run:'Allure', bike:'Puissance', swim:'Allure'};
const RPE_OF = {I1:'1–2', I2:'3–4', I3:'5', I4:'6–7', I5:'8', I6:'9', I7:'10'};
const RPE_TO = r => r <= 2 ? 'I1' : r <= 4 ? 'I2' : r <= 5 ? 'I3' : r <= 7 ? 'I4' : r <= 8 ? 'I5' : r <= 9 ? 'I6' : 'I7';
const inRange = (v, pr) => pr && (v >= (pr[0] || 0)) && (pr[1] == null || v < pr[1]);
const numv = v => parseFloat(String(v == null ? '' : v).replace(',', '.'));
function critOf(st){ return st.crit || 'int'; }
// Intensité déduite du critère saisi (null si impossible, ex. FC sans profil)
function intFromCrit(st, sport, u){
  const c = critOf(st), v = numv(st.cval);
  if (c === 'int') return st.int || null;
  if (!(v > 0)) return null;
  if (c === 'rpe') return RPE_TO(v);
  if (c === 'pct'){ const it = [...INTS].reverse().find(i => i[sport] && v >= (i[sport][0] || 0)); return it ? it.k : 'I1'; }
  if (c === 'fc'){ const f = fcSeuil(u, sport); if (!f) return null; const pc = v / f.v * 100;
    const it = [...INTS].reverse().find(i => i.hr && pc >= (i.hr[0] || 0)); return it ? it.k : 'I1'; }
  return null;
}
function applyCrit(st, sport, u){ const k = intFromCrit(st, sport, u); if (k) setStepInt(st, k); return k; }
const pctTxt = pr => !pr ? '—' : !pr[0] ? `< ${pr[1]} %` : pr[1] == null ? `> ${pr[0]} %` : `${pr[0]}–${pr[1]} %`;
// Libellés affichés pour une ligne : la valeur saisie est exacte, les autres sont déduites
function stepInfo(st, s){
  const sport = s.sport, u = ctxUser(s), c = critOf(st), v = numv(st.cval);
  const k = st.int || defaultInt(st, null), it = INT_BY[k], f = fcSeuil(u, sport), ref = refOf(u, sport);
  const out = {k, c};
  out.int = it ? `${k} · ${INT_SHORT[k]}` : '—';
  if (sport === 'strength'){ out.pct = '—'; out.pace = '—'; }
  else if (c === 'pct' && v > 0){
    out.pct = `${v} %`;
    out.pace = !ref ? '' : sport === 'bike' ? Math.round(ref * v / 100) + ' W' : sport === 'run' ? mmss(3600 / (ref * v / 100)) + '/km' : mmss(ref / (v / 100)) + '/100 m';
  } else { out.pct = pctTxt(it && it[sport]); out.pace = rangeTxt(sport, ref, it && it[sport]); }
  out.rpe = c === 'rpe' && v > 0 ? String(v) : (RPE_OF[k] || '—');
  out.fc = c === 'fc' && v > 0 ? `${Math.round(v)} bpm` : hrTxt(f, it && it.hr);
  out.missingFc = c === 'fc' && v > 0 && !f;
  return out;
}
const labCell = (txt, hl, id) => `<span class="slab ${!txt ? 'na' : ''} ${hl ? 'hl' : ''}" ${id ? `id="${id}"` : ''}>${txt ? esc(txt) : '—'}</span>`;
function stepLabelsHTML(st, s, bi, si){
  const i = stepInfo(st, s), it = INT_BY[i.k];
  return {
    int: `<span class="ilab" style="background:${it ? it.c : '#eee'};${i.k >= 'I6' ? 'color:#fff' : ''}" title="${it ? esc(it.n) : ''}">${esc(i.int)}</span>${i.missingFc ? ' <span class="slab na" title="Renseignez la FC seuil ou la FC max dans le profil">profil ?</span>' : ''}`,
    pct: labCell(i.pct === '—' ? '' : i.pct, i.c === 'pct'),
    rpe: labCell(i.rpe === '—' ? '' : i.rpe, i.c === 'rpe'),
    fc: labCell(i.fc, i.c === 'fc'),
    pace: labCell(i.pace, i.c === 'pct')
  };
}
// Repères d'une ligne en une seule phrase, sans répéter le critère saisi
function stepInfoText(st, s){
  const i = stepInfo(st, s), it = INT_BY[i.k], v = x => x && x !== '—', parts = [];
  if (i.c !== 'int') parts.push(`<span class="ilab" style="background:${it ? it.c : '#eee'};${i.k >= 'I6' ? 'color:#fff' : ''}" title="${it ? esc(it.n) : ''}">${esc(i.int)}</span>`);
  if (s.sport !== 'strength' && i.c !== 'pct' && v(i.pct)) parts.push(`${esc(i.pct.replace(/\s*%$/, ''))} ${PCT_LAB[s.sport]}`);
  if (i.c !== 'rpe' && v(i.rpe)) parts.push(`RPE ${esc(i.rpe)}`);
  if (i.c !== 'fc' && v(i.fc)) parts.push(`FC ${esc(i.fc)}${/bpm/.test(i.fc) ? '' : ' bpm'}`);
  if (s.sport !== 'strength' && v(i.pace)) parts.push(`<b>${esc(i.pace)}</b>`);
  if (i.missingFc) parts.push('<span class="slab na" title="Renseignez la FC seuil ou la FC max dans le profil">profil ?</span>');
  return `<span class="sinfo">${parts.map(x => `<span class="nw">${x}</span>`).join(' <i>·</i> ') || '<span class="slab na">—</span>'}</span>`;
}
// Valeur de départ quand on change de critère, cohérente avec l'intensité actuelle
function seedCrit(st, c, sport, u){
  const it = INT_BY[st.int || 'I2'], mid = pr => !pr ? '' : !pr[0] ? pr[1] - 5 : pr[1] == null ? pr[0] + 5 : Math.round((pr[0] + pr[1]) / 2);
  if (c === 'pct') return String(mid(it[sport]));
  if (c === 'rpe') return ({I1:2, I2:3, I3:5, I4:7, I5:8, I6:9, I7:10})[it.k];
  if (c === 'fc'){ const f = fcSeuil(u, sport); return f && it.hr ? String(Math.round(f.v * mid(it.hr) / 100)) : ''; }
  return '';
}

function setStepInt(st, v){
  if (/^I\d$/.test(v)){ st.int = v; st.zone = INT_BY[v].z; }
  else { st.int = ''; st.zone = v; }
}

function step(dur, zone, extra={}){ return Object.assign({id:uid(), dur, fc:'', zone, rpe:'', taux:'', puiss:'', autre:''}, extra); }
function block(title, reps, steps){ return {id:uid(), title, reps, steps}; }
function emptyBilan(){ return {zones:{Z1:{time:'',fc:'',pw:''},Z2:{time:'',fc:'',pw:''},Z3:{time:'',fc:'',pw:''}}, rpe:'', comment:''}; }

/* Intensités I1–I7 de chaque ligne des séances types (un tableau par bloc, une valeur par ligne) */
const TPL_INTS = {
  't-swim-ef':    [['I2'], ['I2'], ['I3','I1'], ['I1']],          // échauffement · éducatifs · pull-buoy 300 m + récup · retour au calme
  't-swim-seuil': [['I2'], ['I4','I1'], ['I1']],                   // 10 × 100 m au seuil
  't-bike-ef':    [['I2']],                                        // endurance 1 h 30
  't-bike-ss':    [['I2'], ['I4','I1'], ['I1']],                   // sweet spot 88–93 % FTP
  't-bike-pma':   [['I2'], ['I6','I1'], ['I1'], ['I6','I1'], ['I1']], // 30/30 à 120 % PMA
  't-run-ef':     [['I2']],                                        // footing
  't-run-vma':    [['I2'], ['I6','I1'], ['I1']],                   // 10 × 400 m (VMA courte)
  't-run-seuil':  [['I2'], ['I4','I1'], ['I1']],                   // 3 × 10' allure semi / seuil
  't-run-long':   [['I2']],                                        // sortie longue
  't-str-gain':   [['I3','I3','I3','I3','I1']],                    // circuit gainage
  't-str-halt':   [['I3','I3','I3','I3','I1']]                     // circuit haltères
};
// Complète les intensités manquantes ; renvoie true si quelque chose a changé
function addLibraryInts(list){
  let changed = false;
  list.forEach(t => {
    const map = TPL_INTS[t.id];
    t.blocks.forEach((b, bi) => b.steps.forEach((st, si) => {
      if (st.int) return;
      let v = map && map[bi] && map[bi][si];
      if (!v) v = defaultInt(st, b); // séance type personnalisée : déduction d'après la zone et la consigne
      setStepInt(st, v); changed = true;
    }));
  });
  return changed;
}

const TPL_CATS = [['endurance','Endurance'],['recup','Récupération'],['long','Sortie longue'],['technique','Technique / vélocité'],['tempo','Tempo'],['seuil','Seuil'],['vma','VMA / PMA / vitesse'],['cotes','Côtes / force'],['specifique','Allure spécifique'],['renfo','Renforcement'],['mobilite','Mobilité / gainage'],['mixte','Enchaînement / mixte']];
const TPL_LVLS = [['deb','Débutant'],['int','Intermédiaire'],['av','Avancé'],['perf','Performance']];
const CAT_LABEL = Object.fromEntries(TPL_CATS), LVL_LABEL = Object.fromEntries(TPL_LVLS.concat([['all','Tous niveaux']]));
let BUILTINS = null;
function builtinLibrary(){
  if (BUILTINS) return JSON.parse(JSON.stringify(BUILTINS));
  const T = (id, sport, cat, lvl, title, desc, blocks) => ({id, sport, cat, lvl: lvl === 'conf' ? 'av' : lvl, title, desc, blocks, builtin:true});
  const s = (dur, int, autre) => S(dur, int, autre ? {autre} : {});
  const d = (dist, unit, int, autre) => { const st = S('', int, autre ? {autre} : {}); st.mode = 'dist'; st.dist = String(dist); st.unit = unit; return st; };
  const pc = (dur, pct, autre) => { const st = S(dur, 'I2', autre ? {autre} : {}); st.crit = 'pct'; st.cval = String(pct); return st; };
  const pd = (dist, unit, pct, autre) => { const st = d(dist, unit, 'I2', autre); st.crit = 'pct'; st.cval = String(pct); return st; };

function filterTpls(f){
  const q = noAcc(f.q || '');
  return state.library.sessions.filter(t => {
    if (!has('library') && t.builtin && !FREE_TPL.has(t.id)) return false;
    if (f.sport === 'mixte'){ if (!t.parts) return false; }
    else if (f.sport && f.sport !== 'all' && (t.parts || t.sport !== f.sport)) return false;
    if (f.int && f.int !== 'all' && tplInt(t) !== f.int) return false;
    if (f.cat && f.cat !== 'all' && tplCat(t) !== f.cat) return false;
    if (f.lvl && f.lvl !== 'all' && tplLvl(t) !== 'all' && tplLvl(t) !== f.lvl) return false;
    if (f.dur && f.dur !== 'all'){ const m = tplDur(t) / 60; if (f.dur === 's' ? m >= 45 : f.dur === 'm' ? (m < 45 || m > 75) : m <= 75) return false; }
    if (q && !noAcc(t.title + ' ' + (t.desc || '') + ' ' + CAT_LABEL[tplCat(t)]).includes(q)) return false;
    return true;
  });
}

    sb.from('sessions').select('*'),
    sb.from('library_sessions').select('*').order('id'),
    sb.from('library_plans').select('*').order('id')]);
  const err = p.error || s.error || ls.error || lp.error; if (err) throw err;
  state = {users:p.data.map(userFrom), sessions:s.data.map(sessFrom), library:{sessions:ls.data.map(libSFrom), plans:lp.data.map(libPFrom)}};

  me = getUser(me.id) || me;

  const stale = state.library.sessions.filter(t => builtinIds().has(t.id) && !t.custom).map(t => t.id);
  mergeLibrary(state.library);
  if (stale.length) await sb.from('library_sessions').delete().in('id', stale);

  const dp = defaultLibrary().plans, dpIds = new Set(dp.map(p => p.id));

  state.library.plans = [...dp.map(p => ({...p, builtin:true})), ...state.library.plans.filter(p => !dpIds.has(p.id))];
  if (staleP.length) await sb.from('library_plans').delete().in('id', staleP);

  if (has('customLib') && addLibraryInts(state.library.sessions.filter(t => !t.builtin))){ save(); setTimeout(() => toast('Séances types mises à jour avec les intensités I1–I7'), 400); }
}

// Vitesse estimée (m/s) d'une ligne en distance, d'après l'intensité et le profil de l'athlète
function speedFor(st, sport, u){
  const it = INT_BY[st.int] || INT_BY[{Z1:'I2', Z2:'I4', Z3:'I5'}[st.zone] || 'I2'];
  const pr = it[sport] || [60, 70];
  let mid = !pr[0] ? pr[1] - 5 : pr[1] == null ? pr[0] + 5 : (pr[0] + pr[1]) / 2;
  if (st.crit === 'pct' && numv(st.cval) > 0) mid = numv(st.cval);
  const ref = u ? refOf(u, sport) : null;
  if (sport === 'run') return (ref || 14) * mid / 100 / 3.6;          // VMA par défaut : 14 km/h
  if (sport === 'swim') return 100 / ((ref || 120) / (mid / 100));     // allure seuil par défaut : 2:00/100 m
  if (sport === 'bike') return ({I1:24, I2:28, I3:32, I4:35, I5:38, I6:40, I7:45}[it.k] || 28) / 3.6;
  return 1;
}

// Fichier « workout » au format FIT (Garmin et compatibles) : étapes, répétitions et cibles d'allure, de puissance ou de FC.
const FIT_CRC = [0x0000,0xCC01,0xD801,0x1400,0xF001,0x3C00,0x2800,0xE401,0xA001,0x6C00,0x7800,0xB401,0x5000,0x9C01,0x8801,0x4400];

  for (const b of bytes){
    let t = FIT_CRC[crc & 0xF]; crc = (crc >> 4) & 0x0FFF; crc = crc ^ t ^ FIT_CRC[b & 0xF];
    t = FIT_CRC[crc & 0xF]; crc = (crc >> 4) & 0x0FFF; crc = crc ^ t ^ FIT_CRC[(b >> 4) & 0xF];
  }

}
function fitStr(s, n){ const out = new Uint8Array(n), b = new TextEncoder().encode(String(s || '')); let k = Math.min(b.length, n - 1);
  while (k > 0 && (b[k] & 0xC0) === 0x80) k--; out.set(b.slice(0, k)); return out; }
// Cible numérique d'une ligne : [type, bas, haut] ; type 0 = vitesse (mm/s), 1 = FC (bpm + 100), 4 = puissance (W + 1000), 2 = libre
function fitTarget(st, s, u){
  const sport = s.sport, it = INT_BY[st.int] || INT_BY[{Z1:'I2', Z2:'I4', Z3:'I5'}[st.zone] || 'I2'];
  let pr = it[sport];
  if (st.crit === 'pct' && numv(st.cval) > 0) pr = [numv(st.cval) - 2, numv(st.cval) + 2];
  if (st.crit === 'fc' && numv(st.cval) > 0) return [1, Math.round(numv(st.cval)) - 3 + 100, Math.round(numv(st.cval)) + 3 + 100];
  const ref = u ? refOf(u, sport) : null;
  if (ref && pr && (sport === 'run' || sport === 'bike')){
    let lo = pr[0] || Math.max(30, pr[1] - 10), hi = pr[1] == null ? lo + 15 : pr[1];
    if (sport === 'bike') return [4, Math.round(ref * lo / 100) + 1000, Math.round(ref * hi / 100) + 1000];
    return [0, Math.round(ref * lo / 100 / 3.6 * 1000), Math.round(ref * hi / 100 / 3.6 * 1000)];
  }
  const f = u ? fcSeuil(u, sport === 'strength' ? 'run' : sport) : null, hp = it.hr;
  if (f && hp && sport !== 'swim'){
    const lo = Math.round(f.v * (hp[0] || 60) / 100), hi = hp[1] == null ? (f.max || lo + 10) : Math.round(f.v * hp[1] / 100);
    return [1, lo + 100, hi + 100];
  }

}
function fitWorkoutBytes(s){
  const u = getUser(s.athleteId), out = [], push = a => { for (const b of a) out.push(b); };
  const u16 = v => [v & 255, (v >> 8) & 255], u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  const def = (local, global, fields) => { push([0x40 | local, 0, 0, ...u16(global), fields.length]); fields.forEach(f => push(f)); };
  // file_id
  def(0, 0, [[0,1,0x00],[1,2,0x84],[2,2,0x84],[3,4,0x8C],[4,4,0x86]]);
  push([0, 5, ...u16(255), ...u16(0), ...u32((Math.random() * 0xFFFFFFF) >>> 0 || 1), ...u32(Math.floor(Date.now() / 1000) - 631065600)]);
  // étapes
  const steps = [];
  const isRest = (b, st) => st.int === 'I1' || /r[ée]cup|repos|marche/i.test(st.autre || '');
  s.blocks.forEach(b => {
    const n = Math.max(1, +b.reps || 1), first = steps.length;
    const intensity = /échauffement/i.test(b.title || '') ? 2 : /retour au calme/i.test(b.title || '') ? 3 : null;
    b.steps.forEach(st => {
      const dist = st.mode === 'dist' ? distMeters(st) : 0, sec = st.mode === 'dist' ? 0 : parseMS(st.dur);
      const [tt, lo, hi] = fitTarget(st, s, u);
      const L = stepInfo(st, s), info = [L.int, (L.pace && L.pace !== '—') ? L.pace : '', st.autre || ''].filter(Boolean).join(' · ');
      steps.push({name:(st.autre || b.title || L.int || '').slice(0, 40), dtype: dist ? 1 : sec ? 0 : 5, dval: dist ? Math.round(dist * 100) : sec ? sec * 1000 : 0,
        ttype:tt, tval:0, lo, hi, intensity: intensity != null ? intensity : ((n > 1 || b.steps.length > 1) && isRest(b, st)) ? 1 : 0, notes:info});
    });
    if (n > 1 && steps.length > first) steps.push({repeat:true, from:first, times:n});
  });
  // workout
  const sportMap = {run:[1,0], bike:[2,0], swim:[5,17], strength:[10,20]}, [sp, sub] = sportMap[s.sport] || [0,0];
  const title = (s.title || SPORTS[s.sport].label).slice(0, 30);
  const wf = [[8,32,0x07],[4,1,0x00],[11,1,0x00],[6,2,0x84]]; if (s.sport === 'swim') wf.push([14,2,0x84],[15,1,0x00]);
  def(1, 26, wf);
  push([1, ...fitStr(title, 32), sp, sub, ...u16(steps.length)]); if (s.sport === 'swim') push([...u16(2500), 0]);
  def(2, 27, [[254,2,0x84],[0,32,0x07],[1,1,0x00],[2,4,0x86],[3,1,0x00],[4,4,0x86],[5,4,0x86],[6,4,0x86],[7,1,0x00],[8,48,0x07]]);
  steps.forEach((x, i) => {
    if (x.repeat) push([2, ...u16(i), ...fitStr('', 32), 6, ...u32(x.from), 0xFF, ...u32(x.times), ...u32(0xFFFFFFFF), ...u32(0xFFFFFFFF), 0xFF, ...fitStr('', 48)]);
    else push([2, ...u16(i), ...fitStr(x.name, 32), x.dtype, ...u32(x.dtype === 5 ? 0xFFFFFFFF : x.dval), x.ttype, ...u32(x.tval),
      ...u32(x.ttype === 2 ? 0xFFFFFFFF : x.lo), ...u32(x.ttype === 2 ? 0xFFFFFFFF : x.hi), x.intensity, ...fitStr(x.notes, 48)]);
  });
  const data = new Uint8Array(out), hdr = new Uint8Array(14);
  hdr.set([14, 0x20, ...u16(2132), ...u32(data.length), 0x2E, 0x46, 0x49, 0x54]); hdr.set(u16(fitCrc(hdr.slice(0, 12))), 12);
  const crc = fitCrc(data, fitCrc(hdr));
  const file = new Uint8Array(14 + data.length + 2); file.set(hdr); file.set(data, 14); file.set(u16(crc), 14 + data.length);
  return file;
}
function exportFit(s){
  const bytes = fitWorkoutBytes(s), name = `${s.date}-${(s.title || SPORTS[s.sport].label).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'seance'}.fit`;

    <li><b>Autres montres</b> (Coros, Suunto, Wahoo, Polar…) : importez le fichier .fit dans leur application si elle accepte les entraînements au format FIT.</li></ul>
    <p class="ztxt">Les cibles d'allure (CAP) et de puissance (vélo) viennent du profil de l'athlète (VMA, FTP) ; sinon la FC seuil est utilisée. En natation, l'allure figure dans les notes de chaque étape.</p>

// Profil d'intensité de la séance : largeur = durée, hauteur = intensité (I1 à I7)
function sessionGraph(s, hgt = 46, axis = false){
  const u = ctxUser(s), segs = [];
  s.blocks.forEach(b => { const r = Math.min(60, Math.max(0, parseInt(b.reps) || 0));
    for (let i = 0; i < r; i++) b.steps.forEach(st => { const d = stepSec(st, s.sport, u); if (d > 0) segs.push({d, st, b}); }); });
  const tot = segs.reduce((a, x) => a + x.d, 0);
  if (!tot) return axis ? '<div class="ax"><span>Ajoutez des durées ou des distances pour voir le profil de la séance</span></div>' : '';
  let x = 0;
  const rects = segs.map(({d, st, b}) => {
    const k = st.int || {Z1:'I2', Z2:'I4', Z3:'I5'}[st.zone] || 'I2', lvl = +k[1], it = INT_BY[k];
    const w = d / tot * 1000, y = hgt - (lvl / 7) * (hgt - 2);
    const r = `<rect x="${x.toFixed(2)}" y="${y.toFixed(1)}" width="${Math.max(w - (w > 3 ? 0.6 : 0), 0.4).toFixed(2)}" height="${(hgt - y).toFixed(1)}" fill="${it.c}"><title>${esc(b.title || 'Bloc')} · ${k} ${it.n} · ${fmtEst(d)}</title></rect>`;
    x += w; return r;
  }).join('');
  const marks = axis ? [0, 0.25, 0.5, 0.75, 1].map(f => `<span>${fmtC(tot * f) === '–' ? '0' : fmtC(tot * f)}</span>`).join('') : '';
  return `<svg viewBox="0 0 1000 ${hgt}" preserveAspectRatio="none" height="${hgt}" role="img" aria-label="Profil d'intensité de la séance">${[2,4,6].map(l => `<line x1="0" x2="1000" y1="${(hgt - l/7*(hgt-2)).toFixed(1)}" y2="${(hgt - l/7*(hgt-2)).toFixed(1)}" stroke="#e3e8ed" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('')}${rects}</svg>${axis ? `<div class="ax">${marks}</div>` : ''}`;
}
function intTimes(s){
  const u = ctxUser(s), t = {};
  s.blocks.forEach(b => { const r = Math.max(0, parseInt(b.reps) || 0);
    b.steps.forEach(st => { const k = st.int || defaultInt(st, b); t[k] = (t[k] || 0) + r * stepSec(st, s.sport, u); }); });
  return t;
}

/* ===================== Statistiques ===================== */
const STACK = ['run','swim','bike','strength'];          // ordre d'empilement validé pour la lisibilité (daltonisme)
const LONG3 = ['run','bike','swim'];
const LINE_C = {run:'#1f6b45', bike:'#a35a14', swim:'#155d8c'};  // teinte plus foncée du sport pour la ligne « plus longue »
function sessDur(s, mode){ return mode === 'prevu' ? sum(plannedZones(s)) : (isDone(s) ? sum(realZones(s)) : 0); }
// Allures spécifiques saisies dans les bilans, sur une période
const asPace = sec => sec ? `${Math.floor(sec/60)}:${String(Math.round(sec%60)).padStart(2,'0')}` : '–';
function asStats(aid, from, to){
  const out = Object.fromEntries(AS_TYPES.map(([k]) => [k, {sec:0, n:0, w:0, best:0, last:'', lastPace:0}]));
  state.sessions.filter(s => s.athleteId === aid && s.date >= from && s.date <= to && s.bilan && Array.isArray(s.bilan.as))
    .sort((a, b) => a.date.localeCompare(b.date)).forEach(s => s.bilan.as.forEach(r => {
      const o = out[r.t]; if (!o) return; const d = parseMS(r.dur), pc = parseMS(r.pace);
      if (!d && !pc) return; o.n++; o.sec += d;
      if (pc){ o.w += pc * (d || 1); o.wd = (o.wd || 0) + (d || 1); o.best = o.best ? Math.min(o.best, pc) : pc; o.last = s.date; o.lastPace = pc; }
    }));
  Object.values(out).forEach(o => o.avg = o.wd ? o.w / o.wd : 0);
  return out;
}
function asStatsHTML(aid, from, to){
  const st = asStats(aid, from, to), used = AS_TYPES.filter(([k]) => st[k].n);
  if (!used.length) return `<div class="asstat empty">Séances allure (VMA, AS10, AS21, AS42) : aucune saisie sur la période. Elles se renseignent dans le bilan des séances de course.</div>`;
  return `<div class="asstat"><table class="stt"><thead><tr><th>Allure</th><th>Temps</th><th>Séances</th><th>Allure moy.</th><th>Meilleure</th><th>Dernière</th></tr></thead><tbody>
    ${used.map(([k, l]) => { const o = st[k]; return `<tr><td><span class="asdot" style="background:${AS_COLOR[k]}"></span><b>${k}</b></td><td>${fmtC(o.sec)}</td><td>${o.n}</td><td><b>${asPace(o.avg)}</b>/km</td><td>${asPace(o.best)}/km</td><td>${asPace(o.lastPace)}/km${o.last ? ` <span class="ztxt">(${parseYmd(o.last).getDate()} ${MONTHS[parseYmd(o.last).getMonth()]})</span>` : ''}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}
function weeklyStats(aid, endWeek, n, mode){
  const out = [];
  for (let i = n - 1; i >= 0; i--){
    const ws = addDays(endWeek, -7*i), list = sessionsOf(aid, ws);
    const tot = {run:0, bike:0, swim:0, strength:0}, lng = {run:0, bike:0, swim:0};
    list.forEach(s => { const d = sessDur(s, mode); tot[s.sport] += d; if (lng[s.sport] !== undefined) lng[s.sport] = Math.max(lng[s.sport], d); });
    const as = Object.fromEntries(AS_TYPES.map(([k]) => [k, 0])); list.forEach(s => ((s.bilan && s.bilan.as) || []).forEach(r => { if (as[r.t] !== undefined) as[r.t] += parseMS(r.dur); }));
    out.push({ws, tot, lng, as, total: tot.run + tot.bike + tot.swim + tot.strength});
  }
  return out;
}
function niceStep(maxH){ const steps = [0.5, 1, 2, 3, 5, 10, 15, 20]; return steps.find(s => maxH / s <= 5) || 25; }
function statsChart(data){
  const W = 1000, H = 190, L = 44, R = 10, T = 16, B = 24, pw = W - L - R, ph = H - T - B;
  const maxS = Math.max(3600, ...data.map(d => Math.max(d.total, ...LONG3.map(k => d.lng[k]))));
  const step = niceStep(maxS / 3600) * 3600, ymax = Math.ceil(maxS * 1.08 / step) * step;
  const y = v => T + ph - v / ymax * ph, n = data.length, slot = pw / n, bw = Math.min(46, slot * 0.58);
  const cx = i => L + slot * i + slot / 2;
  let g = '';
  for (let v = 0; v <= ymax + 1; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="${v ? '#eef2f5' : '#c9d2da'}" stroke-width="1"/><text x="${L - 6}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="11" fill="#5d6b7a">${v ? fmtC(v).replace("'", ' min') : '0'}</text>`;
  const every = n > 26 ? 4 : n > 12 ? 2 : 1, cur = mondayOf(todayStr());
  data.forEach((d, i) => {
    const x = cx(i) - bw / 2; let base = 0;
    const segs = STACK.filter(k => d.tot[k] > 0);
    segs.forEach((k, j) => {
      const y0 = y(base), y1 = y(base + d.tot[k]), top = j === segs.length - 1, gap = j ? 1 : 0;
      const hh = Math.max(0, y0 - y1 - gap);
      if (hh > 0) g += top && hh > 4
        ? `<path d="M${x},${(y1 + hh).toFixed(1)} V${(y1 + 4).toFixed(1)} Q${x},${y1.toFixed(1)} ${x + 4},${y1.toFixed(1)} H${x + bw - 4} Q${x + bw},${y1.toFixed(1)} ${x + bw},${(y1 + 4).toFixed(1)} V${(y1 + hh).toFixed(1)} Z" fill="${SPORTS[k].color}"/>`
        : `<rect x="${x}" y="${y1.toFixed(1)}" width="${bw}" height="${hh.toFixed(1)}" fill="${SPORTS[k].color}"/>`;
      base += d.tot[k];
    });
    if (d.total > 0 && (n <= 16 || i % every === 0 || i === n - 1)) g += `<text x="${cx(i)}" y="${(y(d.total) - 5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600" fill="#16202b">${fmtC(d.total)}</text>`;
    if (i % every === 0 || i === n - 1){ const dt = parseYmd(d.ws); g += `<text x="${cx(i)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="${d.ws === cur ? '#16202b' : '#5d6b7a'}" font-weight="${d.ws === cur ? 700 : 400}">${dt.getDate()}/${dt.getMonth() + 1}</text>`; }
  });
  LONG3.forEach(k => {
    const pts = data.map((d, i) => [cx(i), y(d.lng[k]), d.lng[k]]);
    if (!pts.some(p => p[2] > 0)) return;
    // une ligne par suite de semaines avec données : pas de retombée à zéro sur les semaines vides
    let run = [];
    const flushRun = () => { if (run.length > 1) g += `<polyline points="${run.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="${LINE_C[k]}" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`; run = []; };
    pts.forEach(p => { if (p[2] > 0) run.push(p); else flushRun(); }); flushRun();
    pts.forEach(p => { if (p[2] > 0) g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="${LINE_C[k]}" stroke="#fff" stroke-width="2"/>`; });
  });
  data.forEach((d, i) => g += `<rect class="hit" data-i="${i}" x="${(L + slot * i).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ph}" fill="transparent"/>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Temps hebdomadaire par sport et plus longue séance de la semaine">${g}</svg>`;
}
function statsView(aid){
  const n = +(ui.statN || 12), end = ui.statEnd || mondayOf(todayStr()), mode = ui.mode || 'realise';
  const data = weeklyStats(aid, end, n, mode);

  const kstrip = `<div class="kstrip"><span>Total ${n} sem. <b>${fmtC(tot)}</b></span><span>Moy. / sem. <b>${fmtC(tot / n)}</b></span>${LONG3.map(k => `<span style="color:${SPORTS[k].color}">${icon(k, 12)} + longue <b>${fmtC(maxL(k))}</b></span>`).join('')}</div>`;

        <span class="sep" style="margin-left:8px">Plus longue séance</span>${LONG3.map(k => `<span style="color:${LINE_C[k]}"><u></u><span style="color:var(--ink)">${SPORTS[k].label}</span></span>`).join('')}</div>
      ${statsChart(data)}

    <details class="stdet"><summary>Détail par semaine (tableau)</summary>
    <div class="pane" style="padding:0;overflow:auto;margin-top:4px"><table class="stt">
      <thead><tr><th>Semaine du</th>${STACK.map(k => `<th>${SPORTS[k].label}</th>`).join('')}<th>Total</th>${AS_TYPES.map(([k]) => `<th>${k}</th>`).join('')}${LONG3.map(k => `<th>+ longue ${SPORTS[k].label}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>

    </table></div></details>`;
}

function svgGiclee(){
  // vue de côté, tête à droite ; épaule S(170,84), hanche H(125,88) ; surface de l'eau y = 82

  // → sortie coude en premier → retour aérien coude haut, avant-bras et main relâchés → entrée doigts en premier
  const KT = '0;.12;.28;.40;.48;.55;.65;.75;.88;1';
  const sh = [0, 22, 50, 118, 170, 200, 240, 275, 320, 360];   // épaule (angle du bras)
  const el = [0, 62, 62, 42, 8, -10, -80, -145, -280, -360];   // coude (angle relatif de l'avant-bras)
  const wr = [0, 14, 6, 0, -6, 10, 28, 30, 10, 0];             // poignet (main relâchée au retour)
  const anim = (vals, cx, cy, begin) => `<animateTransform attributeName="transform" type="rotate" values="${vals.map(v => v + ' ' + cx + ' ' + cy).join(';')}" keyTimes="${KT}" dur="2s" begin="${begin}" repeatCount="indefinite"/>`;
  const hand = (x, y, c, c2) => `<path d="M${x} ${y - 3.2} C${x + 5} ${y - 4} ${x + 10} ${y - 3.4} ${x + 13} ${y - 1.4} C${x + 14.4} ${y - .4} ${x + 14.4} ${y + 1} ${x + 13} ${y + 1.8} C${x + 9} ${y + 3.6} ${x + 4} ${y + 3.6} ${x} ${y + 2.8} Z" fill="${c}"/>
      <path d="M${x + 2.5} ${y - 2.6} C${x + 4.5} ${y - 6} ${x + 7.5} ${y - 6.6} ${x + 8.6} ${y - 5.4} C${x + 9} ${y - 4.6} ${x + 7} ${y - 3.4} ${x + 6} ${y - 2.8}" fill="${c2}"/>
      <path d="M${x + 5} ${y - .8} H${x + 12} M${x + 5} ${y + 1} H${x + 11.5}" stroke="${c2}" stroke-width=".6" stroke-linecap="round"/>`;
  // l'épaule remonte pendant le retour (roulis) : coude haut, main hors de l'eau
  const arm = (begin, c, c2) => `<g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -11;0 -11;0 0" keyTimes="0;.5;.6;.84;1" dur="2s" begin="${begin}" repeatCount="indefinite"/><g>${anim(sh, 170, 84, begin)}
      <line x1="170" y1="84" x2="198" y2="84" stroke="${c}" stroke-width="8.4" stroke-linecap="round"/>

  const leg = (begin, c) => `<g>${rotA([-9, 9, -9], 125, 88, 'keyTimes="0;.5;1" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1" dur=".66s" begin="' + begin + '" repeatCount="indefinite"')}
      <line x1="125" y1="88" x2="87" y2="89" stroke="${c}" stroke-width="12.5" stroke-linecap="round"/>
      <line x1="125" y1="88" x2="104" y2="88.6" stroke="#1d2a36" stroke-width="13.6" stroke-linecap="round"/>
      <g>${rotA([4, 22, 4], 87, 89, 'keyTimes="0;.5;1" dur=".66s" begin="' + begin + '" repeatCount="indefinite"')}
        <line x1="87" y1="89" x2="52" y2="90" stroke="${c}" stroke-width="9" stroke-linecap="round"/>
        <g>${rotA([-4, -16, -4], 52, 90, 'keyTimes="0;.5;1" dur=".66s" begin="' + begin + '" repeatCount="indefinite"')}
          <path d="M54 86.6 C48 85.4 41 85.6 35.5 87.6 C33.6 88.4 33.6 90.6 35.6 91.4 C40.5 92.8 47 93.2 54 93.4 C56 91.4 56 88.6 54 86.6 Z" fill="${c}"/>
          <path d="M36 88.4 q-1.6 1.2 0 2.4" stroke="${c === SKIN ? SKIN2 : '#b88a66'}" stroke-width=".7" fill="none"/>
        </g></g></g>`;
  const drop = (dx, dy, r) => `<circle cx="106" cy="80" r="${r}" fill="#1f7fbf"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.06;.42;1" dur="1s" begin="-.06s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;${dx} ${dy};${dx} ${dy}" keyTimes="0;.06;.42;1" dur="1s" begin="-.06s" repeatCount="indefinite"/></circle>`;
  return `<svg viewBox="22 30 214 142" role="img" aria-label="Animation : éducatif giclée en crawl">
    <rect x="22" y="30" width="214" height="142" rx="10" fill="#eef6fb"/>
    ${arm('-1s', SKIN2, '#b88a66')}
    ${leg('-.33s', SKIN2)}
    <path d="M173 77 C156 74.5 137 76.5 123 81.5 C119.5 85 119.5 91.5 123.5 95 C140 97.5 158 96.8 171.5 92.6 C177 88.6 177.4 80.6 173 77 Z" fill="${SKIN}"/>
    <path d="M150 77.5 C144 78.5 140 80 137 81" stroke="${SKIN2}" stroke-width="1" fill="none" opacity=".7"/>
    ${leg('0s', SKIN)}

    ${drop(-16,-20,3.4)}${drop(-6,-26,2.8)}${drop(-26,-12,2.6)}${drop(-12,-14,2.2)}${drop(-22,-24,1.9)}${drop(-2,-16,2)}
    <g opacity=".9"><defs><marker id="gcar" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7z" fill="#d9822b"/></marker></defs>
      <path d="M162 152H124" stroke="#d9822b" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#gcar)"/>
      <text x="143" y="165" text-anchor="middle" font-size="9.5" font-weight="700" fill="#a35a14" font-family="Inter,system-ui,sans-serif">poussée accélérée : giclée</text></g>

}
function svgGicleeDessus(){
  // vue de dessus, tête à droite ; axe du corps y = 100 ; épaules (168,88) et (168,112)
  const KT = [0, .12, .28, .40, .48, .55, .65, .75, .88, 1];
  const E = [[196,86],[198,88],[177,84],[151,86],[141,89],[147,79],[160,68],[177,68],[191,76],[196,86]];   // coude
  const W = [[222,88],[214,95],[178,99],[147,97],[119,92],[124,84],[146,79],[176,81],[206,86],[222,88]];   // poignet
  const A = [0, 22, 12, 0, -6, 16, 32, 26, 10, 0];                                                       // main relâchée
  const S = [168, 88];
  const tip = (e, w, a, s) => { let dx = w[0] - e[0], dy = w[1] - e[1]; const n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n;
    const r = a * s * Math.PI / 180, c = Math.cos(r), si = Math.sin(r); return [w[0] + 11 * (dx * c - dy * si), w[1] + 11 * (dx * si + dy * c)]; };
  const mir = pt => [pt[0], 200 - pt[1]];
  const series = (s) => { // s = 1 bras du haut, -1 bras du bas (symétrique)
    const f = s === 1 ? (pt => pt) : mir;
    const arm = KT.map((_, i) => [f(S), f(E[i]), f(W[i])].map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ')).join(';');
    const hand = KT.map((_, i) => [f(W[i]), tip(f(E[i]), f(W[i]), A[i], s)].map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ')).join(';');
    return {arm, hand, first: arm.split(';')[0], firstH: hand.split(';')[0]};
  };
  const kt = KT.join(';');
  const armSVG = (s, begin, color, layer) => { const d = series(s);
    // layer « dessous » : toujours visible (teinte d'eau) ; layer « dessus » : visible seulement hors de l'eau (retour aérien)
    const op = layer === 'under' ? '' : `<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.5;.53;.92;1" dur="2s" begin="${begin}" repeatCount="indefinite"/>`;
    return `<g opacity="${layer === 'under' ? .6 : 0}">${op}
      <polyline points="${d.first}" fill="none" stroke="${color}" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="points" values="${d.arm}" keyTimes="${kt}" dur="2s" begin="${begin}" repeatCount="indefinite"/></polyline>
      <polyline points="${d.firstH}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"><animate attributeName="points" values="${d.hand}" keyTimes="${kt}" dur="2s" begin="${begin}" repeatCount="indefinite"/></polyline>
    </g>`; };
  const leg = (y, s, begin) => { // battements : vus de dessus, la jambe s'allonge et se raccourcit légèrement
    const pts = d => `122,${y} 86,${y + s * .8} ${52 + d},${y + s * 1.6} ${40 + d * 1.6},${y + s * 1.4}`;
    return `<polyline points="${pts(0)}" fill="none" stroke="${SKIN}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="points" values="${pts(0)};${pts(4)};${pts(0)}" keyTimes="0;.5;1" dur=".66s" begin="${begin}" repeatCount="indefinite"/></polyline>`; };
  const splash = (y, begin) => [[-14,-6,3],[-8,-12,2.6],[-20,4,2.4],[-6,8,2.2],[-18,-12,2]].map(([dx, dy, r]) =>
    `<circle cx="122" cy="${y}" r="${r}" fill="#ffffff"><animate attributeName="opacity" values="0;0;.95;0;0" keyTimes="0;.47;.5;.7;1" dur="2s" begin="${begin}" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 0;${dx} ${dy};${dx} ${dy}" keyTimes="0;.47;.5;.7;1" dur="2s" begin="${begin}" repeatCount="indefinite"/></circle>`).join('');
  return `<svg viewBox="22 34 226 132" role="img" aria-label="Animation : éducatif giclée en crawl, vue de dessus">
    <rect x="22" y="34" width="226" height="132" rx="10" fill="#9fd3ee"/>
    <rect x="22" y="96.5" width="226" height="7" fill="#1b4f72" opacity=".22"/>
    <path d="M22 44 H248 M22 156 H248" stroke="#e2654f" stroke-width="4" stroke-dasharray="8 8"/>
    <path d="M22 44 H248 M22 156 H248" stroke="#ffffff" stroke-width="4" stroke-dasharray="8 8" stroke-dashoffset="8"/>
    ${armSVG(1, '0s', SKIN2, 'under')}${armSVG(-1, '-1s', SKIN2, 'under')}
    ${leg(95, -1, '0s')}${leg(105, 1, '-.33s')}
    <path d="M104 92 H128 L127 108 H105 Z" fill="#1d2a36"/>
    <path d="M173 86 C177.5 91 177.5 109 173 114 C160 113 140 110.5 127 108.5 C121 105 121 95 127 91.5 C140 89.5 160 87 173 86 Z" fill="${SKIN}"/>
    <path d="M150 100 H130" stroke="${SKIN2}" stroke-width="1" opacity=".6"/>
    <ellipse cx="187" cy="100" rx="11.5" ry="9" fill="#e2654f"/>
    <path d="M186 91.3 Q190 100 186 108.7" stroke="#16202b" stroke-width="1.2" fill="none"/>
    ${armSVG(1, '0s', SKIN, 'over')}${armSVG(-1, '-1s', SKIN, 'over')}
    ${splash(88, '0s')}${splash(112, '-1s')}
    <text x="30" y="58" font-size="8.5" font-weight="700" fill="#0b4b73" font-family="Inter,system-ui,sans-serif">VUE DE DESSUS</text>
    <text x="30" y="148" font-size="7.6" fill="#0b4b73" font-family="Inter,system-ui,sans-serif">sortie de la main à la cuisse · retour coude écarté</text>
  </svg>`;
}

function minStr(min){ min = Math.max(5, Math.round(min/5)*5); return min >= 60 ? Math.floor(min/60) + ':' + String(min%60).padStart(2,'0') + ':00' : min + ':00'; }

const R = (x, min=2, max=40) => Math.max(min, Math.min(max, Math.round(x)));
const planSpec = g => (PLAN_SPECS[g.type] || PLAN_SPECS.run)[g.obj] || Object.values(PLAN_SPECS[g.type] || PLAN_SPECS.run)[0];
function genSession(role, phase, f, g){
  const B = planSpec(g).base, obj = g.obj, type = g.type, hard = phase === 'build' || phase === 'spec';
  const wu = (m=15) => block('Échauffement', 1, [S(minStr(m), 'I2')]);

    case 'rl': {
      const sp = hard && ['semi','marathon','cm','c2'].includes(obj), m = long();
      const blocks = [block('Sortie longue', 1, [S(minStr(m * (sp ? 0.75 : 1)), 'I2')])];
      if (sp) blocks.push(block('Fin à allure spécifique', 1, [S(minStr(m*0.25), ['marathon','cm'].includes(obj) ? 'I3' : 'I4')]));
      return ['run', 'Sortie longue', blocks]; }
    case 'rq': {
      const k = type === 'tri' ? 'tri' : type === 'challenge' ? B.q : obj;
      if (k === 'trail') return ['run', ...q1('Côtes', R(8*f,6,14), '1:00', 'I5', '1:30', {autre:'en montée, retour en descente'})];

      if (phase === 'base') return ['run', ...q1('Fartlek 30/30', R(10*f,6,20), '0:30', 'I6', '0:30')];
      const Q = {
        build: {'5k':['VMA courte', R(12*f,8,20), '0:45','I6','0:45'], '10k':['VMA longue', R(5*f,4,8), '3:30','I5','2:00'], semi:['Seuil', R(3*f,2,5), '8:00','I4','2:00'],
                marathon:['Allure marathon', R(3*f,2,4), '15:00','I3','3:00'], tri:['VMA 3\'', R(6*f,4,8), '3:00','I5','2:00']},
        spec:  {'5k':['Allure 5 km', R(5*f,4,8), '3:00','I5','2:00'], '10k':['Allure 10 km', R(3*f,3,5), '7:00','I5','2:30'], semi:['Allure semi', R(2*f,2,3), '20:00','I4','3:00'],

    case 'cw1': case 'cw2': {

      if (d1) return ['run', 'Challenge jour 1 : allure course', [wu(), block('Allure course jour 1', 1, [S(minStr(Math.min(15 + 20*f, 45)), B.q === 'marathon' ? 'I4' : 'I5', {autre: B.q === 'trail' ? 'en côte' : 'allure de la 1re course'})]), cd()]];

      return ['run', 'Challenge jour 2 : jambes fatiguées', [block('Sortie longue', 1, [S(minStr(m*0.7), 'I2', B.dplus ? {autre:`≈ ${Math.round(B.dplus*f/50)*50} m D+`} : {})]), block('Fin à allure course', 1, [S(minStr(m*0.3), B.q === 'trail' ? 'I3' : 'I3')])]]; }

    case 'be': return ['bike', 'Endurance vélo', [block('Endurance', 1, [S(minStr(B.ef*f), 'I2', {taux:'85-95 rpm'})])]];
    case 'bl': case 'bl2': {

      const blocks = [block('Endurance', 1, [S(minStr(m*(phase === 'build' ? 0.7 : 1)), 'I2', {taux:'85-95 rpm', autre: B.dplus ? `parcours vallonné, ≈ ${Math.round(B.dplus*f/100)*100} m D+` : 's\'alimenter toutes les 45\''})])];
      if (phase === 'build') blocks.push(block('Blocs tempo', R(3*f,2,4), [S('10:00','I3'), S('5:00','I2')]));

    case 'sst': return ['strength', 'Renfo nageur', [block('Circuit', 3, [S('0:45','I3',{autre:'rotation externe élastique'}), S('0:45','I3',{autre:'tirage élastique'}), S('0:45','I3',{autre:'pompes'}), S('0:45','I3',{autre:'gainage dynamique'}), rec('1:00')])]];
  }

function generatePlan(g){
  const n = Math.max(2, Math.min(30, +g.weeks || 8)), lvl = (LEVELS.find(l => l[0] === g.level) || LEVELS[1])[2];
  const per = Math.max(3, Math.min(7, +g.per || 4)), pattern = (GEN_DAYS[g.type] || GEN_DAYS.run)[per];
  const taper = n >= 4 ? 1 : 0, spec = n >= 8 ? Math.max(2, Math.round(n*0.25)) : (n >= 5 ? 1 : 0);
  const base = Math.max(1, Math.round((n - taper - spec) * 0.5)), build = n - taper - spec - base;
  const weeks = []; let k = 0;
  for (let w = 0; w < n; w++){
    let phase = w < base ? 'base' : w < base + build ? 'build' : w < n - taper ? 'spec' : 'taper';
    let f;
    if (phase === 'taper') f = lvl * 0.6;
    else if (w % 4 === 3 && w < n - taper - 1){ phase = 'rec'; f = lvl * 0.7; }
    else { f = Math.min(lvl * (1 + 0.06*k), lvl * 1.35); k++; }
    if (phase !== 'taper' && w === n - taper - 1 && n - taper - 1 > 0 && taper) f = Math.min(f, lvl * 1.1);
    const byDay = {};
    const sessions = pattern.map(([d, role, ch]) => {
      const [sport, title, blocks] = genSession(role, phase, f, g);
      byDay[d] = (byDay[d] || 0) + 1;
      return {day:d, sport, title, blocks, chain:!!ch, ord:byDay[d] - 1};
    });
    weeks.push({w, phase, f, sessions});
  }
  return weeks;
}
function genDefaults(){

  if (!LEVELS.some(l => l[0] === g.level)) g.level = 'int';
  if (!PLAN_SPECS[g.type]) g.type = 'run';
  if (OBJ_OLD[g.obj]) g.obj = OBJ_OLD[g.obj];
  if (!PLAN_SPECS[g.type][g.obj]) g.obj = GEN_OBJ[g.type][0][0];

}

const FR_M = ['janv','fevr','mars','avr','mai','juin','juil','aout','sept','oct','nov','dec'];
const noAcc = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function toYmd(str){
  if (!str) return null; str = String(str).trim();
  if (/^\d{4}-\d{2}-\d{2}T/.test(str)){ const d = new Date(str); if (!isNaN(d)) return ymd(d); }
  const iso = str.match(/(\d{4})-(\d{2})-(\d{2})/); if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
  const fr = noAcc(str).match(/(\d{1,2})\s+([a-z]+)\.?\s+(\d{4})/);
  if (fr){ const m = FR_M.findIndex(x => fr[2].startsWith(x.slice(0,3)) && (x !== 'juin' && x !== 'juil' ? true : fr[2].startsWith(x))); if (m >= 0) return ymd(new Date(+fr[3], m, +fr[1])); }
  const d = new Date(str.replace(/,(?=\s*\d{1,2}:)/, '')); if (!isNaN(d)) return ymd(d);
  return null;
}
function stravaSport(t){
  t = noAcc(String(t||''));
  if (t === '1') return 'bike'; if (t === '9') return 'run';
  if (/swim|natation|nage/.test(t)) return 'swim';
  if (/ride|bik|cycl|velo/.test(t)) return 'bike';
  if (/run|course|trail|jog/.test(t)) return 'run';
  if (/weight|workout|poids|renfo|crossfit|muscu|training|entrain|hiit|core/.test(t)) return 'strength';
  return null;
}
function zoneOf(hr, u, sport){ const L = hrLimits(u, sport); return !hr ? null : hr <= L.z1 ? 'Z1' : hr <= L.z2 ? 'Z2' : 'Z3'; }
function emptyAcc(){ const z = {}; ZONES.forEach(k => z[k] = {t:0, hr:0, hrN:0, pw:0, pwN:0, dist:0}); return z; }
function paceTxt(sport, sec, dist){
  if (!dist || !sec) return '';
  if (sport === 'swim'){ const p = sec / (dist/100); return Math.floor(p/60) + ':' + String(Math.round(p%60)).padStart(2,'0') + '/100 m'; }
  if (sport === 'run'){ const p = sec / (dist/1000); return Math.floor(p/60) + ':' + String(Math.round(p%60)).padStart(2,'0') + '/km'; }
  if (sport === 'bike') return (dist/1000 / (sec/3600)).toFixed(1) + ' km/h';
  return '';
}
function hav(a, b){ const R = 6371000, r = x => x*Math.PI/180, dl = r(b.lat-a.lat), dn = r(b.lon-a.lon);
  const x = Math.sin(dl/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function parseTrack(xml, kind, u, defSport, force){
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const all = (n, tag) => Array.from(n.getElementsByTagNameNS('*', tag));
  const txt = (n, tag) => { const e = all(n, tag)[0]; return e ? e.textContent.trim() : ''; };
  let pts = [], name = '', sportRaw = '';
  if (kind === 'gpx'){
    name = txt(doc, 'name'); sportRaw = txt(doc, 'type');
    pts = all(doc, 'trkpt').map(p => ({t: Date.parse(txt(p,'time')), lat:+p.getAttribute('lat'), lon:+p.getAttribute('lon'), hr:+txt(p,'hr')||0, pw:+txt(p,'power')||0}));
  } else {
    const act = all(doc, 'Activity')[0]; sportRaw = act ? act.getAttribute('Sport') : ''; name = txt(doc, 'Id');
    pts = all(doc, 'Trackpoint').map(p => { const hrE = all(p,'HeartRateBpm')[0];
      return {t: Date.parse(txt(p,'Time')), lat:+txt(p,'LatitudeDegrees')||null, lon:+txt(p,'LongitudeDegrees')||null, d:+txt(p,'DistanceMeters')||null, hr: hrE ? +txt(hrE,'Value')||0 : 0, pw:+txt(p,'Watts')||0}; });
  }
  pts = pts.filter(p => !isNaN(p.t)).sort((a,b) => a.t - b.t);
  if (pts.length < 2) throw new Error('aucun point horodaté');
  const detected = stravaSport(sportRaw), sport = force || detected || defSport;
  const z = emptyAcc(); let noHr = 0, dur = 0;
  for (let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i+1], dt = (b.t - a.t) / 1000;
    if (dt <= 0 || dt > 30) continue; // pauses ignorées
    const zn = zoneOf(a.hr, u, sport) || (noHr += dt, 'Z1');
    const acc = z[zn]; acc.t += dt; dur += dt;
    if (a.hr){ acc.hr += a.hr*dt; acc.hrN += dt; }
    if (a.pw){ acc.pw += a.pw*dt; acc.pwN += dt; }
    if (a.d != null && b.d != null) acc.dist += Math.max(0, b.d - a.d);
    else if (a.lat && b.lat) acc.dist += hav(a, b);
  }
  const date = ymd(new Date(pts[0].t));
  if (!name || /^\d{4}-\d{2}-\d{2}T/.test(name)) name = SPORTS[sport].label + ' ' + longDate(date);
  return [{name, date, sport, dur, z, noHr: noHr > dur*0.5, detected}];
}
function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.length > 1);
}
function fromSummary(a, u){
  // a: {name,date,sport,dur,hr,pw,dist}
  const z = emptyAcc(), zn = zoneOf(a.hr, u, a.sport) || 'Z1';
  z[zn].t = a.dur; if (a.hr){ z[zn].hr = a.hr*a.dur; z[zn].hrN = a.dur; } if (a.pw){ z[zn].pw = a.pw*a.dur; z[zn].pwN = a.dur; } z[zn].dist = a.dist || 0;
  return {name:a.name, date:a.date, sport:a.sport, dur:a.dur, z, noHr:!a.hr, summary:true};
}
function parseStravaCSV(text, u){
  const rows = parseCSV(text); if (!rows.length) return [];
  const head = rows[0].map(x => noAcc(x.trim()));
  const col = (...names) => { for (const n of names){ const i = head.indexOf(noAcc(n)); if (i >= 0) return i; } return -1; };
  const iD = col('Activity Date','Date de l\'activite'), iN = col('Activity Name','Nom de l\'activite'), iT = col('Activity Type','Type d\'activite');
  const iE = col('Moving Time','Duree de deplacement','Elapsed Time','Temps ecoule'), iH = col('Average Heart Rate','Frequence cardiaque moyenne');
  const iW = col('Average Watts','Puissance moyenne'), iS = col('Average Speed','Vitesse moyenne');
  if (iD < 0 || iE < 0) throw new Error('colonnes Strava introuvables (Activity Date / Elapsed Time)');
  return rows.slice(1).map(r => {
    const dur = +r[iE] || 0, spd = +r[iS] || 0;
    return {name: r[iN] || '', date: toYmd(r[iD]), sport: stravaSport(r[iT]), rawType: r[iT], dur, hr: +r[iH] || 0, pw: +r[iW] || 0, dist: spd ? spd*dur : 0};
  });
}
function bilanFromAct(act){
  const bilan = emptyBilan(); bilan.validated = true; bilan.validatedAt = new Date().toISOString();
  ZONES.forEach(k => { const a = act.z[k]; if (!a.t) return;
    bilan.zones[k].time = Math.floor(a.t/3600) + ':' + String(Math.round((a.t%3600)/60)).padStart(2,'0');
    bilan.zones[k].fc = a.hrN ? String(Math.round(a.hr/a.hrN)) : '';
    bilan.zones[k].pw = act.sport === 'bike' && a.pwN ? Math.round(a.pw/a.pwN) + ' W' : paceTxt(act.sport, a.t, a.dist);
  });
  return bilan;
}
// Import d'un fichier GPX / TCX directement dans le bilan de la séance ouverte
async function importIntoSession(file, adopt){
  const s = ui.sessionId ? getSession(ui.sessionId) : null;
  if (!s || !canEdit(s)) return false;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext !== 'gpx' && ext !== 'tcx'){ toast('Format non pris en charge : choisissez un fichier .gpx ou .tcx'); return false; }
  try {
    const u = getUser(s.athleteId);
    // zones FC, allures et puissance calculées pour le sport de la séance
    const text = await file.text();
    let act = parseTrack(text, ext, u, s.sport, adopt ? null : s.sport)[0];
    if (!act || act.dur < 60){ toast('Fichier sans données exploitables (trop court ou sans horodatage)'); return false; }
    const detected = act.detected;
    if (adopt){
      if (detected && detected !== s.sport){ s.sport = detected; act = parseTrack(text, ext, u, s.sport, s.sport)[0]; }
      if (!s.title) s.title = act.name || 'Séance importée';
    }
    const keep = {rpe: s.bilan.rpe, comment: s.bilan.comment};
    const b = bilanFromAct(act);
    const dist = ZONES.reduce((a, k) => a + (act.z[k].dist || 0), 0);
    const note = `Fichier ${file.name} : ${fmtC(act.dur)}${dist ? ' · ' + (dist >= 1000 ? (dist/1000).toFixed(2).replace('.', ',') + ' km' : Math.round(dist) + ' m') : ''}${act.noHr ? ' (FC absente : temps placé en Z1)' : ''}`;
    b.rpe = keep.rpe; b.comment = [keep.comment, note].filter(Boolean).join('\n');
    s.bilan = b; save(); render();
    const warn = [];
    if (act.date && act.date !== s.date) warn.push('date du fichier : ' + longDate(act.date));
    if (!adopt && detected && detected !== s.sport) warn.push('sport du fichier : ' + SPORTS[detected].label);
    toast((adopt ? 'Séance importée et validée' : 'Bilan rempli et séance validée') + (warn.length ? ' — attention, ' + warn.join(', ') : ''));
    return true;
  } catch(err){ toast('Fichier illisible : ' + err.message); return false; }
}

function applyActivity(aid, act, report){
  const u = getUser(aid);
  if (!act.date){ report.push({...act, result:'Date illisible, ignorée', cls:'warn'}); return; }
  if (!act.sport){ report.push({...act, result:'Type non géré, ignoré', cls:'warn'}); return; }
  if (act.dur < 60){ report.push({...act, result:'Trop courte, ignorée', cls:'warn'}); return; }
  const zones = {}; ZONES.forEach(k => zones[k] = {t: act.z[k].t});
  if (state.sessions.some(s => s.athleteId === aid && s.date === act.date && s.sport === act.sport && isDone(s) && (s.title === act.name || (s.bilan.comment || '').includes(act.name)))){ report.push({...act, zones, result:'Déjà importée', cls:'warn'}); return; }
  const bilan = bilanFromAct(act);
  const note = (act.file ? 'Importé du fichier ' + act.file : 'Importé de Strava : ' + act.name) + (act.noHr ? ' (FC absente : temps placé en Z1)' : act.summary ? ' (zone selon FC moyenne)' : '');
  let target = state.sessions.find(s => s.athleteId === aid && s.date === act.date && s.sport === act.sport && !isDone(s));
  let result;
  if (target){ bilan.rpe = target.bilan.rpe; bilan.comment = [target.bilan.comment, note].filter(Boolean).join('\n'); target.bilan = bilan; result = 'Bilan ajouté à « ' + (target.title || SPORTS[target.sport].label) + ' »'; }
  else { bilan.comment = note; target = {id:newId(), athleteId:aid, date:act.date, sport:act.sport, title:act.name, blocks:[], bilan}; state.sessions.push(target); result = 'Séance réalisée créée'; }
  report.push({...act, zones, result, cls:'ok'});
}
async function handleFiles(files){
  const aid = curAid(), u = getUser(aid);
  const def = (document.getElementById('defSport')||{}).value || 'run'; ui.defSport = def;
  const report = [];
  for (const f of files){
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    try {
      const text = await f.text();
      if (ext === 'csv') parseStravaCSV(text, u).forEach(a => applyActivity(aid, a.sport ? fromSummary(a, u) : {...a, z:emptyAcc()}, report));
      else if (ext === 'gpx' || ext === 'tcx') parseTrack(text, ext, u, def).forEach(a => applyActivity(aid, {...a, file:f.name}, report));
      else report.push({name:f.name, result:'Format non pris en charge', cls:'warn'});
    } catch(err){ report.push({name:f.name, result:'Fichier illisible : ' + err.message, cls:'warn'}); }
  }
  save(); ui.importReport = report; render();
  toast(report.filter(r => r.cls === 'ok').length + ' activité(s) importée(s)');
}
/* Synchronisation via la fonction serveur */
async function stravaSync(){
  const aid = curAid();
  ui.stravaConn = 'busy'; ui.stravaMsg = ''; render();
  try {
    const { data, error } = await sb.functions.invoke('strava', { body: {action:'sync', athlete_id:aid} });
    if (error) throw error;
    if (data && data.error) throw new Error(data.error);
    const rep = (data && data.report) || [];
    await loadAll();
    ui.importReport = rep.map(r => ({name:r.name, date:r.date, result:r.result, cls: /erreur|non géré|introuvable/.test(r.result) ? 'warn' : 'ok'}));
    ui.stravaMsg = `<span class="ok">${rep.length} activité(s) traitée(s).</span>`;
  } catch(e){ ui.stravaMsg = '<span class="warn">Échec de la synchronisation : ' + esc(e.message || e) + '</span>'; }
  ui.stravaConn = ''; render();
}
