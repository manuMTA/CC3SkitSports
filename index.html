  if (!name || /^\d{4}-\d{2}-\d{2}T/.test(name)) name = SPORTS[sport].label + ' ' + longDate(date);
  return [{name, date, sport, dur, z, noHr: noHr > dur*0.5}];
}
function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.length > 1);
}
function fromSummary(a, u){
  // a: {name,date,sport,dur,hr,pw,dist}
  const z = emptyAcc(), zn = zoneOf(a.hr, u, a.sport) || 'Z1';
  z[zn].t = a.dur; if (a.hr){ z[zn].hr = a.hr*a.dur; z[zn].hrN = a.dur; } if (a.pw){ z[zn].pw = a.pw*a.dur; z[zn].pwN = a.dur; } z[zn].dist = a.dist || 0;
  return {name:a.name, date:a.date, sport:a.sport, dur:a.dur, z, noHr:!a.hr, summary:true};
}
function parseStravaCSV(text, u){
  const rows = parseCSV(text); if (!rows.length) return [];
  const head = rows[0].map(x => noAcc(x.trim()));
  const col = (...names) => { for (const n of names){ const i = head.indexOf(noAcc(n)); if (i >= 0) return i; } return -1; };
  const iD = col('Activity Date','Date de l\'activite'), iN = col('Activity Name','Nom de l\'activite'), iT = col('Activity Type','Type d\'activite');
  const iE = col('Moving Time','Duree de deplacement','Elapsed Time','Temps ecoule'), iH = col('Average Heart Rate','Frequence cardiaque moyenne');
  const iW = col('Average Watts','Puissance moyenne'), iS = col('Average Speed','Vitesse moyenne');
  if (iD < 0 || iE < 0) throw new Error('colonnes Strava introuvables (Activity Date / Elapsed Time)');
  return rows.slice(1).map(r => {
    const dur = +r[iE] || 0, spd = +r[iS] || 0;
    return {name: r[iN] || '', date: toYmd(r[iD]), sport: stravaSport(r[iT]), rawType: r[iT], dur, hr: +r[iH] || 0, pw: +r[iW] || 0, dist: spd ? spd*dur : 0};
  });
}
function applyActivity(aid, act, report){
  const u = getUser(aid);
  if (!act.date){ report.push({...act, result:'Date illisible, ignorée', cls:'warn'}); return; }
  if (!act.sport){ report.push({...act, result:'Type non géré, ignoré', cls:'warn'}); return; }
  if (act.dur < 60){ report.push({...act, result:'Trop courte, ignorée', cls:'warn'}); return; }
  const zones = {}; ZONES.forEach(k => zones[k] = {t: act.z[k].t});
  if (state.sessions.some(s => s.athleteId === aid && s.date === act.date && s.sport === act.sport && isDone(s) && (s.title === act.name || (s.bilan.comment || '').includes(act.name)))){ report.push({...act, zones, result:'Déjà importée', cls:'warn'}); return; }

    bilan.zones[k].fc = a.hrN ? String(Math.round(a.hr/a.hrN)) : '';

  if (target){ bilan.rpe = target.bilan.rpe; bilan.comment = [target.bilan.comment, note].filter(Boolean).join('\n'); target.bilan = bilan; result = 'Bilan ajouté à « ' + (target.title || SPORTS[target.sport].label) + ' »'; }

}
async function handleFiles(files){
  const aid = me.role === 'coach' ? ui.athleteId : me.id, u = getUser(aid);
  const def = (document.getElementById('defSport')||{}).value || 'run'; ui.defSport = def;

    case 'open': ui.sessionId = el.dataset.id; render(); break;
    case 'back': ui.view = me.role === 'coach' ? 'athlete' : 'home'; ui.sessionId = null; render(); break;
    case 'stab': ui.stab = el.dataset.v; render(); break;
    case 'new': pendingDate = el.dataset.d; openTplPicker('new'); break;
    case 'loadtpl': openTplPicker('replace'); break;
    case 'picktpl': {
      const t = state.library.sessions.find(x => x.id === el.dataset.id); if (!t) break;
      if (ui.pickMode === 'replace' && s){
        s.sport = t.sport; s.title = t.title.replace(/^[^—]+—\s*/, ''); s.blocks = cloneBlocks(t.blocks);
        if (!isDone(s)) s.bilan = emptyBilan();
        save(); closeModal(); render(); toast('Séance type chargée');
      } else {
        const aid = me.role === 'coach' ? ui.athleteId : me.id, ns = addFromTemplate(aid, t, pendingDate);
        save(); closeModal(); ui.sessionId = ns.id; ui.tab = 'agenda'; ui.week = mondayOf(pendingDate); render();
      }
      break; }
    case 'pick': {
      const aid = me.role === 'coach' ? ui.athleteId : me.id;
      const ns = {id:newId(), athleteId:aid, date:pendingDate, sport:el.dataset.v, title:'', blocks:[block('Échauffement',1,[step('10:00','Z1')])], bilan:emptyBilan()};
      state.sessions.push(ns); save(); closeModal();
      ui.sessionId = ns.id; ui.tab = 'agenda'; render();
      const t = document.querySelector('[data-f="title"]'); if (t) t.focus();
      break; }
    case 'mvday': moveSession(s, addDays(s.date, +el.dataset.v), false); break;
    case 'dupsess': moveSession(s, addDays(s.date, 1), true); break;
    case 'libsport': ui.lf = ui.lf || {}; ui.lf.sport = el.dataset.v; ui.lf.cat = 'all'; render(); break;
    case 'pksport': ui.pf.sport = el.dataset.v; ui.pf.cat = 'all'; refreshPicker(); break;
    case 'libopen': ui.libOpen = ui.libOpen === el.dataset.id ? null : el.dataset.id; render(); break;
    case 'addtpl': {
      const aid = me.role === 'coach' ? ui.athleteId : me.id, t = state.library.sessions.find(x => x.id === el.dataset.id);
      const d = document.getElementById('libd-'+t.id).value || todayStr();
      const ns = addFromTemplate(aid, t, d); save(); ui.sessionId = ns.id; ui.week = mondayOf(d); ui.tab = 'agenda'; render(); toast('Séance ajoutée au ' + longDate(d)); break; }
    case 'applyplan': {
      const aid = me.role === 'coach' ? ui.athleteId : me.id, p = state.library.plans.find(x => x.id === el.dataset.id);
      const start = mondayOf(document.getElementById('libd-'+p.id).value || nextMonday()); let n = 0;
      p.weeks.forEach((w, wi) => planItems(w).forEach(it => { state.sessions.push({id:(typeof newId === 'function' ? newId() : uid()), athleteId:aid, date:addDays(start, wi*7 + it.day), sport:it.sport, title:it.title, blocks:cloneBlocks(it.blocks), bilan:emptyBilan()}); n++; }));
      save(); ui.week = start; ui.tab = 'agenda'; ui.sessionId = null; render(); toast(`Plan appliqué : ${n} séances ajoutées`); break; }
    case 'libdel': { const t = state.library.sessions.find(x => x.id === el.dataset.id);
      confirmBox(`Retirer « ${t.title} » de la bibliothèque ?`, () => { state.library.sessions = state.library.sessions.filter(x => x !== t); save(); render(); }); break; }
    case 'savetpl': {
      const cat0 = tplCat({sport:s.sport, blocks:s.blocks});
      openModal(`<h3>Enregistrer comme séance type</h3><div class="frm dense">
        <div class="field"><label>Titre</label><input id="st-title" value="${esc(s.title || SPORTS[s.sport].label)}"></div>
        <div class="two"><div class="field"><label>Type</label><select id="st-cat">${TPL_CATS.map(([k,l]) => `<option value="${k}" ${k===cat0?'selected':''}>${l}</option>`).join('')}</select></div>
        <div class="field"><label>Niveau</label><select id="st-lvl"><option value="all">Tous niveaux</option>${TPL_LVLS.map(([k,l]) => `<option value="${k}">${l}</option>`).join('')}</select></div></div>
        <div class="field"><label>Description (facultatif)</label><input id="st-desc" placeholder="objectif, consignes…"></div>
        <div class="ztxt">Sport : ${SPORTS[s.sport].label} · durée ${fmtC(sum(plannedZones(s)))}</div></div>
        <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-a="mclose">Annuler</button><button class="btn primary" data-a="savetpl2">Enregistrer</button></div>`);
      break; }
    case 'savetpl2': {
      const v = id => (document.getElementById(id) || {}).value || '';
      if (!v('st-title').trim()){ document.getElementById('st-title').focus(); break; }
      state.library.sessions.push({id:'t-'+uid(), sport:s.sport, cat:v('st-cat'), lvl:v('st-lvl'), title:v('st-title').trim(), desc:v('st-desc').trim(), blocks:cloneBlocks(s.blocks), custom:true});
      save(); closeModal(); toast('Séance type enregistrée dans la bibliothèque'); break; }
    case 'saveplan': {
      const aid = me.role === 'coach' ? ui.athleteId : me.id;
      const cnt = k => Array.from({length:k}, (_, i) => sessionsOf(aid, addDays(ui.week, 7*i)).length).reduce((a, b) => a + b, 0);
      openModal(`<h3>Enregistrer comme plan type</h3><div class="frm dense">
        <div class="field"><label>Titre du plan</label><input id="sp-title" placeholder="ex. Bloc foncier hiver"></div>
        <div class="two"><div class="field"><label>Semaines à partir du ${longDate(ui.week)}</label><select id="sp-n">${[1,2,3,4,5,6,8,10,12].map(k => `<option value="${k}">${k} semaine${k>1?'s':''} (${cnt(k)} séances)</option>`).join('')}</select></div>
        <div class="field"><label>Description (facultatif)</label><input id="sp-desc"></div></div>
        <div class="ztxt">Les séances sont copiées avec leur contenu (blocs, intensités, consignes) ; les bilans ne sont pas repris.</div></div>
        <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-a="mclose">Annuler</button><button class="btn primary" data-a="saveplan2">Enregistrer</button></div>`);
      break; }
    case 'saveplan2': {
      const aid = me.role === 'coach' ? ui.athleteId : me.id, v = id => (document.getElementById(id) || {}).value || '';
      if (!v('sp-title').trim()){ document.getElementById('sp-title').focus(); break; }
      const n = +v('sp-n') || 1, weeks = [];
      for (let i = 0; i < n; i++){ const ws = addDays(ui.week, 7*i);
        weeks.push(sessionsOf(aid, ws).map(x => ({day:(parseYmd(x.date).getDay() + 6) % 7, sport:x.sport, title:x.title, blocks:cloneBlocks(x.blocks)}))); }
      if (!weeks.some(w => w.length)){ toast('Aucune séance sur ces semaines'); break; }
      state.library.plans.push({id:'up-'+uid(), title:v('sp-title').trim(), desc:v('sp-desc').trim(), weeks});
      save(); closeModal(); toast('Plan type enregistré dans la bibliothèque'); break; }
    case 'plandel': { const pl = state.library.plans.find(x => x.id === el.dataset.id);
      confirmBox(`Supprimer le plan « ${pl.title} » ?`, () => { state.library.plans = state.library.plans.filter(x => x !== pl); save(); render(); }); break; }
    case 'preset': {
      const g = genDefaults(), P = TRI_PRESETS[el.dataset.o], lv = el.dataset.l;
      Object.assign(g, {type:'tri', obj:el.dataset.o, level:lv, weeks:P.weeks[lv], per:P.per[lv]});
      render(); const gen = document.querySelector('.gen'); if (gen) gen.scrollIntoView({behavior:'smooth', block:'start'});
      toast(`${P.label} · ${LEVELS.find(l => l[0] === lv)[1]} : réglez la date de début puis « Appliquer »`); break; }
    case 'stravasync': stravaSync(); break;
    case 'statn': ui.statN = +el.dataset.v; render(); break;
    case 'statprev': ui.statEnd = addDays(ui.statEnd || mondayOf(todayStr()), -7); render(); break;
    case 'statnext': ui.statEnd = addDays(ui.statEnd || mondayOf(todayStr()), 7); render(); break;
    case 'expick0': {
      ui.exTarget = {bi:+el.dataset.b, si: el.dataset.s === undefined ? null : +el.dataset.s};
      const list = EXERCISES.slice().sort((x, y) => (y.sport === s.sport) - (x.sport === s.sport));
      openModal(`<h3>Choisir un exercice</h3><div class="expk">${list.map(e => `<button data-a="expick" data-id="${e.id}">${e.svg()}<span><b>${esc(e.title)}</b><span class="ztxt">${esc(e.cat)} · ${SPORTS[e.sport].label}</span><br><span class="ztxt">${esc(e.dose)}</span></span></button>`).join('')}</div>
        <div class="row" style="justify-content:space-between;margin-top:10px"><span class="ztxt">Catalogue d'exercices en construction.</span><button class="btn" data-a="mclose">Annuler</button></div>`, true);
      break; }
    case 'expick': {
      const ex = EX_BY[el.dataset.id], tg = ui.exTarget; if (!ex || !tg || !s) break;
      const b = s.blocks[tg.bi]; if (!b) break;
      if (tg.si === null){
        const st = step(ex.line.dur || '', 'Z1', {autre: ex.title}); setStepInt(st, ex.line.int);
        if (ex.line.dist){ st.mode = 'dist'; st.dist = ex.line.dist; st.unit = ex.line.unit; }
        b.steps.push(st);
      } else {
        const st = b.steps[tg.si]; st.autre = ex.title;
        if (!stepSec(st, s.sport, ctxUser(s))){ if (ex.line.dist){ st.mode = 'dist'; st.dist = ex.line.dist; st.unit = ex.line.unit; } else st.dur = ex.line.dur; }
      }
      save(); closeModal(); render(); toast(`« ${ex.title} » ajouté`); break; }
    case 'exsport': ui.xf.sport = el.dataset.v; render(); break;
    case 'expause': { const svgs = el.closest('.exanim').querySelectorAll('svg'), paused = svgs[0].animationsPaused();
      svgs.forEach(s => paused ? s.unpauseAnimations() : s.pauseAnimations()); el.textContent = paused ? '❚❚' : '▶'; break; }
    case 'exshow': { const ex = EX_BY[el.dataset.id]; if (ex) openModal(exCardHTML(ex, false) + '<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-a="mclose">Fermer</button></div>', true); break; }
    case 'exadd': {
      const ex = EX_BY[el.dataset.id], t = ui.sessionId ? getSession(ui.sessionId) : null;
      if (!t){ toast('Ouvrez d\'abord une séance dans l\'onglet Semaine'); break; }
      if (!canEdit(t)) break;
      const st = step(ex.line.dur || '', 'Z1', {autre: ex.title}); setStepInt(st, ex.line.int);
      if (ex.line.dist){ st.mode = 'dist'; st.dist = ex.line.dist; st.unit = ex.line.unit; }
      if (!t.blocks.length) t.blocks.push(block('Corps de séance', 1, []));
      t.blocks[t.blocks.length - 1].steps.push(st); save(); toast(`« ${ex.title} » ajouté à la séance`); break; }
    case 'sub': ui[el.dataset.k] = el.dataset.v; render(); break;
    case 'profsport': ui.profSport = el.dataset.v; render(); break;
    case 'genapply': {
      const aid = me.role === 'coach' ? ui.athleteId : me.id, g = genDefaults(), plan = generatePlan(g), start = mondayOf(g.start || nextMonday());
      const n = plan.reduce((a,wk)=>a+wk.sessions.length,0);
      confirmBox(`Ajouter ${n} séances sur ${plan.length} semaines à partir du ${longDate(start)} ?`, () => {
        plan.forEach(wk => wk.sessions.forEach(x => state.sessions.push({id:(typeof newId === 'function' ? newId() : uid()), athleteId:aid, date:addDays(start, wk.w*7 + x.day), sport:x.sport, title:x.title, blocks:x.blocks, bilan:emptyBilan()})));
        save(); ui.week = start; ui.tab = 'agenda'; ui.sessionId = null; render(); toast(`Plan ajouté : ${n} séances`);
      });
      break; }
    case 'mclose': if (el.classList.contains('modal-bg') && e.target !== el) break; closeModal(); break;
    case 'myes': { const fn = pendingConfirm; pendingConfirm = null; closeModal(); if (fn) fn(); break; }
    case 'delsess': confirmBox('Supprimer définitivement cette séance et son bilan ?', () => { state.sessions = state.sessions.filter(x => x !== s); save(); ui.sessionId = null; render(); }); break;
    case 'badd': {
      const n = s.blocks.length, last = n ? (s.blocks[n-1].title || '') : '';
      const title = !n ? 'Échauffement' : /retour|calme/i.test(last) ? 'Corps de séance ' + (n + 1) : n === 1 ? 'Corps de séance' : 'Retour au calme';
      const st = step(title === 'Retour au calme' ? '10:00' : '', 'Z1'); setStepInt(st, /échauffement/i.test(title) ? 'I2' : title === 'Retour au calme' ? 'I1' : 'I3');
      s.blocks.push(block(title, 1, [st])); save(); render(); break; }
    case 'bdel': confirmBox('Supprimer ce bloc ?', () => { s.blocks.splice(bi,1); save(); render(); }); break;
    case 'bup': if (bi > 0){ [s.blocks[bi-1], s.blocks[bi]] = [s.blocks[bi], s.blocks[bi-1]]; save(); render(); } break;
    case 'bdown': if (bi < s.blocks.length-1){ [s.blocks[bi+1], s.blocks[bi]] = [s.blocks[bi], s.blocks[bi+1]]; save(); render(); } break;
    case 'bdup': { const c = JSON.parse(JSON.stringify(s.blocks[bi])); c.id = uid(); c.steps.forEach(x=>x.id=uid()); s.blocks.splice(bi+1,0,c); save(); render(); break; }
    case 'sadd': {
      const prev = s.blocks[bi].steps[s.blocks[bi].steps.length - 1], st = step('', 'Z1');
      if (prev && prev.mode === 'dist'){ st.mode = 'time'; }
      setStepInt(st, prev && prev.int && +prev.int[1] >= 3 ? 'I1' : (prev && prev.int) || 'I2');
      if (st.int === 'I1') st.autre = 'récup';
      s.blocks[bi].steps.push(st); save(); render(); break; }
    case 'sdel': s.blocks[bi].steps.splice(+el.dataset.s, 1); save(); render(); break;
    case 'prefill': s.bilan.zones = plannedBilanZones(s); s.bilan.prefilled = true; s.bilan.edited = false; save(); render(); break;
    case 'validate': {
      const t = getSession(el.dataset.id); if (!t || !canEdit(t)) break;
      const v = !isDone(t); setValidated(t, v); save(); render();
      toast(v ? 'Séance validée' + (sum(realZones(t)) ? ' : ' + fmtC(sum(realZones(t))) : '') : 'Validation annulée');
      break; }
    case 'rpe': s.bilan.rpe = s.bilan.rpe === el.dataset.v ? '' : el.dataset.v; save(); render(); break;
    case 'authmode': ui.authMode = el.dataset.v; ui.authErr = ''; ui.authMsg = ''; render(); break;
    case 'stravalogin': stravaAuthorize('login'); break;
    case 'stravalink': stravaAuthorize('link'); break;
    case 'refresh': startSession(); break;
    case 'approve': case 'unapprove': { const u = getUser(el.dataset.id); u.approved = a === 'approve'; save(); render(); toast(u.name + (u.approved ? ' validé(e)' : ' suspendu(e)')); break; }
    case 'deluser': {
      const u = getUser(el.dataset.id);
      confirmBox(`Supprimer le compte de ${u.name} et toutes ses séances ? Cette action est définitive.`, async () => {
        const r = await sb.from('profiles').delete().eq('id', u.id);
        if (r.error){ toast('Suppression impossible : ' + r.error.message); return; }
        state.users = state.users.filter(x => x !== u); state.sessions = state.sessions.filter(x => x.athleteId !== u.id); takeSnapshot(); render(); });
      break; }
  }
});

function moveSession(s, date, copy){
  if (!s || !canEdit(s) || !date) return;
  if (!copy && s.date === date) return;
  let target = s;
  if (copy){
    target = JSON.parse(JSON.stringify(s)); target.id = newId(); target.bilan = emptyBilan();
    target.blocks.forEach(b => { b.id = uid(); b.steps.forEach(x => x.id = uid()); });
    state.sessions.push(target);
  }
  target.date = date; ui.sessionId = target.id;
  if (date < ui.week || date > addDays(ui.week,6)) ui.week = mondayOf(date);
  save(); render();
}
let dragId = null;
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('[data-drag]'); if (!c) return;
  dragId = c.dataset.drag; c.classList.add('dragging');
  try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'copyMove'; } catch(_){}
});
document.addEventListener('dragend', e => {
  dragId = null; document.querySelectorAll('.dragging,.over').forEach(x => x.classList.remove('dragging','over'));
});
document.addEventListener('dragover', e => {
  const d = e.target.closest && e.target.closest('[data-day]'); if (!d || !dragId) return;
  e.preventDefault(); try { e.dataTransfer.dropEffect = (e.ctrlKey || e.altKey) ? 'copy' : 'move'; } catch(_){}
  document.querySelectorAll('.over').forEach(x => x !== d && x.classList.remove('over')); d.classList.add('over');
});
document.addEventListener('dragleave', e => {
  const d = e.target.closest && e.target.closest('[data-day]'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('over');
});
document.addEventListener('drop', e => {
  const d = e.target.closest && e.target.closest('[data-day]'); if (!d || !dragId) return;
  e.preventDefault(); const id = dragId; dragId = null;
  moveSession(getSession(id), d.dataset.day, e.ctrlKey || e.altKey);
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.hr){ const aid = me.role === 'coach' ? ui.athleteId : me.id, u = getUser(aid); const v = parseInt(el.value); if (v > 0){ u.hr[el.dataset.hr] = v; save(); } }
  if (el.id === 'stravaFile' && el.files.length) handleFiles(Array.from(el.files));
  if (el.id === 'defSport') ui.defSport = el.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.p){
    const aid = me.role === 'coach' ? ui.athleteId : me.id, u = getUser(aid), [sp, k] = el.dataset.p.split('.');
    getParams(u)[sp][k] = el.value.trim(); save(); render();
  }
  if (el.dataset && el.dataset.g){
    const g = genDefaults(); g[el.dataset.g] = el.value;
    if (el.dataset.g === 'type') g.obj = GEN_OBJ[g.type][0][0];
    render();
  }
});
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('#dropzone'); if (z){ e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('#dropzone'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('#dropzone'); if (z){ e.preventDefault(); z.classList.remove('over'); if (e.dataTransfer.files.length) handleFiles(Array.from(e.dataTransfer.files)); } });

/* ===================== Démarrage ===================== */
async function startSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ me = null; state = null; render(); return; }
  const { data:prof, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (error || !prof){ ui.authErr = 'Profil introuvable. Réessayez dans un instant.'; me = null; render(); return; }
  me = userFrom(prof); state = null; render();
  try {
    if (me.role === 'coach' || me.approved) await loadAll();
    else state = {users:[me], sessions:[], library:{sessions:[], plans:[]}};
  } catch(e){ $app.innerHTML = '<div class="loading">Erreur de chargement : ' + esc(e.message || e) + '</div>'; return; }
  render();
}
async function handleStravaReturn(){
  const q = new URLSearchParams(location.search);
  if (!q.has('code') && !q.has('error')) return;
  const code = q.get('code'), st = q.get('state'), scope = q.get('scope') || '';
  history.replaceState(null, '', location.pathname);
  if (q.get('error')){ ui.authErr = 'Connexion Strava annulée.'; return; }
  if (!/activity:read/.test(scope)) toast('Sans l\'accès aux activités, l\'import Strava ne fonctionnera pas.');
  $app.innerHTML = '<div class="loading">Connexion à Strava…</div>';
  try {
    const { data, error } = await sb.functions.invoke('strava', { body:{ action: st === 'link' ? 'link' : 'login', code } });
    if (error) throw error;
    if (data && data.error) throw new Error(data.error);
    if (st === 'link') toast('Compte Strava relié : import des activités en cours');
    else {
      let r = await sb.auth.verifyOtp({ token_hash:data.token_hash, type:'email' });
      if (r.error) r = await sb.auth.verifyOtp({ token_hash:data.token_hash, type:'magiclink' });
      if (r.error) throw r.error;
    }
  } catch(e){ ui.authErr = 'Connexion Strava impossible : ' + (e.message || e); }
}
(async () => {
  if (!sb){ $app.innerHTML = '<div class="loading">Configuration manquante : renseignez le fichier config.js.</div>'; return; }
  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY'){ ui.authMode = 'newpw'; me = null; state = null; render(); } });
  $app.innerHTML = '<div class="loading">Chargement…</div>';
  await handleStravaReturn();
  if (ui.authMode === 'newpw'){ render(); return; }
  await startSession();
})();
</script>
