<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi Triathlon</title>
<meta name="description" content="Suivez vos volumes de natation, vélo et course à pied : saisie, import ou connexion Strava.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<header>
  <div class="brand"><span class="logo"><i style="background:var(--swim)"></i><i style="background:var(--bike)"></i><i style="background:var(--run)"></i></span>Suivi Triathlon</div>
  <div id="userArea" class="user-chip"></div>
</header>
<main id="app"><div class="card empty"><span class="spin"></span><p class="sub mt">Chargement…</p></div></main>
<footer>
  <span>Vos données ne sont visibles que par vous. Les séances saisies ou importées sont aussi visibles par votre coach ; celles synchronisées depuis Strava restent privées.</span>
</footer>
<input type="file" id="fileInput" accept=".csv,text/csv" class="hidden">

<script src="/dashboard.js"></script>
<script src="/import.js"></script>
<script>
"use strict";
const ERRORS = {
  refus: "Vous avez refusé l’autorisation sur Strava.",
  scope: "Pour récupérer vos activités, cochez l’accès à vos activités lors de l’autorisation Strava.",
  etat: "La connexion a expiré. Merci de recommencer.",
  strava: "Strava a refusé la connexion. Réessayez dans un instant.",
  strava_off: "La connexion Strava n’est pas encore activée sur ce site.",
  capacite: "L’application a atteint le nombre maximum d’athlètes autorisé par Strava. Créez plutôt un compte avec votre e-mail.",
  deja_lie: "Ce compte Strava est déjà lié à un autre compte du site."
};
const SPORT_CHOICES = ["Natation","Vélo","Course à pied","Renforcement","Autre"];
const State = { me:null, acts:[], busy:false, flash:null, authTab:"login", stravaEnabled:false };

function toAct(r){
  const local = String(r.start_date_local||"").replace(/(Z|[+-]\d\d:?\d\d)$/,"");
  return { ts:new Date(local).getTime(), raw:r.sport_type, t:sportOf(r.sport_type), dist:r.distance||0, sec:r.moving_time||0,
           elev:r.elevation||0, hr:Math.round(r.avg_hr||0), name:r.name||"", uid:r.id, stravaId:r.strava_id?String(r.strava_id):"", source:r.source };
}
async function api(path, opts={}){
  const r = await fetch(path, Object.assign({credentials:"same-origin", headers:{"Content-Type":"application/json"}}, opts));
  const data = await r.json().catch(()=>({}));
  if (!r.ok){ const e = new Error(data.error || "Erreur réseau"); e.status = r.status; throw e; }
  return data;
}
const post = (path, body) => api(path, {method:"POST", body:JSON.stringify(body||{})});
function flashHTML(){
  if (!State.flash) return "";
  return `<div class="note ${State.flash.type==="err"?"err":State.flash.type==="ok"?"ok":""}" style="margin-bottom:16px">${esc(State.flash.msg)}</div>`;
}

async function load(){
  const q = new URLSearchParams(location.search);
  if (q.get("erreur")) { State.flash = {type:"err", msg: ERRORS[q.get("erreur")] || "La connexion a échoué."}; history.replaceState(null, "", "/"); }
  try {
    const d = await api("/api/me");
    State.stravaEnabled = d.stravaEnabled;
    if (!d.connected){ State.me = null; renderLanding(); return; }
    State.me = d; State.acts = d.activities.map(toAct);
    renderUser(); render();
    const last = d.user.last_sync ? new Date(d.user.last_sync).getTime() : 0;
    if (d.user.has_strava && Date.now() - last > 3*3600*1000) sync(true);
  } catch(e){
    $("#app").innerHTML = `<div class="card empty"><h1>Service indisponible</h1><p class="sub">${esc(e.message)}</p><div class="actions"><button class="btn" onclick="location.reload()">Réessayer</button></div></div>`;
  }
}
async function reloadMe(){
  const d = await api("/api/me");
  if (!d.connected){ location.href = "/"; return; }
  State.me = d; State.acts = d.activities.map(toAct); renderUser();
}

/* ---------- Accueil : connexion ---------- */
function renderLanding(){
  $("#userArea").innerHTML = "";
  const login = State.authTab === "login";
  $("#app").innerHTML = `
  <section class="hero">
    <div class="brand" style="justify-content:center"><span class="logo"><i style="background:var(--swim);height:34px;width:12px"></i><i style="background:var(--bike);height:34px;width:12px"></i><i style="background:var(--run);height:34px;width:12px"></i></span></div>
    <h1>Votre entraînement triathlon, en un coup d’œil</h1>
    <p>Suivez vos séances de natation, de vélo et de course : saisissez-les, importez un fichier, ou connectez Strava pour les récupérer automatiquement.</p>
    ${flashHTML()}
    <div class="card auth-card">
      <div class="seg" id="authSeg" style="width:100%">
        <button data-k="login" class="${login?"on":""}" style="flex:1">Se connecter</button>
        <button data-k="register" class="${login?"":"on"}" style="flex:1">Créer un compte</button>
      </div>
      <form id="authForm" class="form" novalidate>
        ${login ? "" : `<div class="row" style="gap:10px"><label style="flex:1">Prénom<input name="firstname" autocomplete="given-name" required></label><label style="flex:1">Nom<input name="lastname" autocomplete="family-name"></label></div>`}
        <label>Adresse e-mail<input name="email" type="email" autocomplete="email" required></label>
        <label><span>Mot de passe${login?"":` <span class="tooltip-hint">(8 caractères minimum)</span>`}</span><input name="password" type="password" autocomplete="${login?"current-password":"new-password"}" required minlength="8"></label>
        <p class="form-err hidden" id="authErr"></p>
        <button class="btn primary" type="submit" style="width:100%;justify-content:center">${login?"Se connecter":"Créer mon compte"}</button>
        ${login ? `<p class="tooltip-hint" style="margin:0">Mot de passe oublié ? Demandez à votre coach de le réinitialiser.</p>` : ""}
      </form>
      ${State.stravaEnabled ? `<div class="or"><span>ou</span></div><a class="strava-btn" style="margin:0;width:100%;justify-content:center" href="/api/auth/strava">Se connecter avec Strava</a>` : ""}
    </div>
    <div class="features">
      <div><b>Volumes</b><span>Heures et kilomètres par semaine et par discipline.</span></div>
      <div><b>Progression</b><span>Évolution de vos allures en course, natation et vélo.</span></div>
      <div><b>Régularité</b><span>Calendrier de vos jours d’entraînement et records personnels.</span></div>
    </div>
  </section>`;
  $("#authSeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; State.authTab = b.dataset.k; State.flash = null; renderLanding(); };
  $("#authForm").onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const err = $("#authErr"), btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true; err.classList.add("hidden");
    try {
      await post("/api/auth/" + (login ? "login" : "register"), f);
      State.flash = login ? null : {type:"ok", msg:"Bienvenue ! Ajoutez votre première séance ou importez un fichier."};
      await load();
    } catch(x){ err.textContent = x.message; err.classList.remove("hidden"); btn.disabled = false; }
  };
}

/* ---------- Menu utilisateur ---------- */
function renderUser(){
  const u = State.me.user;
  $("#userArea").innerHTML = `
    ${u.profile && /^https:/.test(u.profile) ? `<img src="${esc(u.profile)}" alt="">` : ""}
    <div class="menu">
      <button class="btn sm" id="menuBtn">${esc(u.firstname || "Mon compte")} ▾</button>
      <div class="menu-panel hidden" id="menuPanel">
        ${State.me.isAdmin ? `<a href="/admin">Administration</a>` : ""}
        ${u.has_password ? `<button data-m="password">Changer mon mot de passe</button>` : `<button data-m="email">Ajouter un e-mail et un mot de passe</button>`}
        ${u.has_strava ? `<a href="https://www.strava.com/athletes/${u.strava_id}" target="_blank" rel="noopener">Voir mon profil Strava</a>${u.email?`<button data-m="unlink">Délier Strava</button>`:""}`
                       : State.stravaEnabled ? `<a href="/api/auth/strava">Connecter Strava</a>` : ""}
        <button data-m="logout">Se déconnecter</button>
        <button data-m="delete" class="danger">Supprimer mon compte…</button>
      </div>
    </div>`;
  const panel = $("#menuPanel");
  $("#menuBtn").onclick = e => { e.stopPropagation(); panel.classList.toggle("hidden"); };
  document.addEventListener("click", ()=>panel.classList.add("hidden"));
  panel.querySelectorAll("[data-m]").forEach(b => b.onclick = () => ({
    password: passwordDialog, email: emailDialog, unlink: unlinkDialog, delete: deleteDialog,
    logout: async () => { await post("/api/auth/logout").catch(()=>{}); location.href = "/"; }
  })[b.dataset.m]());
}

/* ---------- Tableau de bord ---------- */
function render(){
  destroyCharts();
  const u = State.me.user, acts = State.acts;
  $("#app").innerHTML = `${flashHTML()}
    <div class="row" style="align-items:flex-end;justify-content:space-between">
      <div>
        <h1>Bonjour ${esc(u.firstname || "")}</h1>
        <p class="sub">${acts.length} séances${u.has_strava ? ` · Strava synchronisé ${u.last_sync ? dfTime.format(new Date(u.last_sync)) : "–"}` : ""}</p>
      </div>
      <div class="row" style="gap:8px">
        <button class="btn primary" id="bAdd">+ Ajouter une séance</button>
        <button class="btn" id="bImport" ${State.busy?"disabled":""}>Importer un fichier</button>
        ${u.has_strava ? `<button class="btn" id="bSync" ${State.busy?"disabled":""}>${State.busy?'<span class="spin"></span> Synchronisation…':"Synchroniser Strava"}</button>`
          : State.stravaEnabled ? `<a class="btn" href="/api/auth/strava">Connecter Strava</a>` : ""}
      </div>
    </div>
    <div id="dash"></div>`;
  $("#bAdd").onclick = () => addDialog();
  $("#bImport").onclick = importDialog;
  const bs = $("#bSync"); if (bs) bs.onclick = () => sync(false);
  $("#dash").insertAdjacentHTML("beforebegin", viewTabsHTML());
  bindViewTabs($("#app"));
  if (DS.view === "week"){ renderWeek($("#dash"), acts); return; }
  if (!acts.length){
    $("#dash").innerHTML = `<div class="card empty mt"><div class="icons"><i style="background:var(--swim)"></i><i style="background:var(--bike)"></i><i style="background:var(--run)"></i></div>
      <h2>Aucune séance pour l’instant</h2>
      <p class="sub" style="max-width:520px;margin:0 auto">Ajoutez votre première séance à la main, importez l’export de votre montre ou de Strava (fichier CSV)${State.stravaEnabled && !u.has_strava ? ", ou connectez Strava" : ""}.</p>
      <div class="actions"><button class="btn primary" id="bAdd2">+ Ajouter une séance</button><button class="btn" id="bImport2">Importer un fichier</button></div></div>`;
    $("#bAdd2").onclick = () => addDialog(); $("#bImport2").onclick = importDialog;
    return;
  }
  renderDashboard($("#dash"), acts);
}
DS.onChange = render;
DS.onAddForDay = ts => addDialog(ts);
DS.onDelete = async id => {
  if (!await confirmDialog("Supprimer cette séance ?", "Elle sera retirée de vos statistiques.", "Supprimer")) return;
  try { await api("/api/activities?id="+encodeURIComponent(id), {method:"DELETE"}); await reloadMe(); State.flash = {type:"ok", msg:"Séance supprimée."}; }
  catch(e){ State.flash = {type:"err", msg:e.message}; }
  render();
};

async function sync(silent){
  if (State.busy) return;
  State.busy = true; if (!silent) State.flash = null; render();
  try {
    const r = await post("/api/sync");
    await reloadMe();
    if (!silent || r.added) State.flash = {type:"ok", msg: r.skipped ? "Vos données Strava sont déjà à jour." : r.added ? `${r.added} activité(s) récupérée(s) depuis Strava.` : "Aucune nouvelle activité sur Strava."};
  } catch(e){
    if (e.status === 401 && !State.me){ location.href = "/"; return; }
    State.flash = {type:"err", msg:e.message};
  } finally { State.busy = false; render(); }
}

/* ---------- Fenêtres ---------- */
function modal(html){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(bg);
  bg.addEventListener("mousedown", e => { if (e.target === bg) bg.remove(); });
  bg.querySelectorAll("[data-x]").forEach(b => b.onclick = () => bg.remove());
  return bg;
}
function confirmDialog(title, text, ok){
  return new Promise(resolve => {
    const bg = modal(`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="actions"><button class="btn" data-x>Annuler</button><button class="btn primary" data-ok>${esc(ok)}</button></div>`);
    bg.querySelector("[data-x]").onclick = () => { bg.remove(); resolve(false); };
    bg.querySelector("[data-ok]").onclick = () => { bg.remove(); resolve(true); };
  });
}
function formDialog(title, fieldsHtml, submitLabel, onSubmit){
  const bg = modal(`<h2>${esc(title)}</h2><form class="form" novalidate>${fieldsHtml}<p class="form-err hidden"></p><div class="actions"><button type="button" class="btn" data-x>Annuler</button><button class="btn primary" type="submit">${esc(submitLabel)}</button></div></form>`);
  const form = bg.querySelector("form"), err = bg.querySelector(".form-err");
  form.onsubmit = async e => {
    e.preventDefault();
    const btn = form.querySelector("[type=submit]"); btn.disabled = true; err.classList.add("hidden");
    try { await onSubmit(Object.fromEntries(new FormData(form)), form); bg.remove(); }
    catch(x){ err.textContent = x.message; err.classList.remove("hidden"); btn.disabled = false; }
  };
  const first = form.querySelector("input,select"); if (first) first.focus();
  return bg;
}

function addDialog(dayTs){
  const today = dayTs ? new Date(dayTs) : new Date(), p = n => String(n).padStart(2,"0");
  const d = `${today.getFullYear()}-${p(today.getMonth()+1)}-${p(today.getDate())}`;
  const bg = formDialog("Ajouter une séance", `
    <div class="row" style="gap:10px"><label style="flex:1">Date<input type="date" name="date" value="${d}" required></label><label style="width:120px">Heure<input type="time" name="time" value="08:00"></label></div>
    <label>Sport<select name="sport">${SPORT_CHOICES.map(s=>`<option>${s}</option>`).join("")}</select></label>
    <label><span>Titre <span class="tooltip-hint">(facultatif)</span></span><input name="name" maxlength="200" placeholder="ex. Fractionné 10 × 400 m"></label>
    <div class="row" style="gap:10px">
      <label style="flex:1">Durée<span class="row" style="gap:6px;flex-wrap:nowrap"><input name="h" type="number" min="0" max="48" placeholder="h" style="width:70px"><input name="m" type="number" min="0" max="59" placeholder="min" style="width:80px"></span></label>
      <label style="flex:1"><span id="distLbl">Distance (km)</span><input name="dist" type="number" min="0" step="0.01" inputmode="decimal"></label>
    </div>
    <div class="row" style="gap:10px"><label style="flex:1">Dénivelé + (m)<input name="elev" type="number" min="0"></label><label style="flex:1">FC moyenne<input name="hr" type="number" min="0" max="250"></label></div>`,
    "Enregistrer", async f => {
      const sec = (Number(f.h)||0)*3600 + (Number(f.m)||0)*60;
      if (!sec) throw new Error("Indiquez la durée de la séance.");
      const swim = f.sport === "Natation";
      await post("/api/activities", {activity:{
        start_date_local: `${f.date}T${f.time||"08:00"}:00`, sport_type: f.sport, name: f.name,
        distance: (Number(String(f.dist).replace(",","."))||0) * (swim ? 1 : 1000), moving_time: sec,
        elevation: Number(f.elev)||0, avg_hr: Number(f.hr)||0 }});
      await reloadMe(); State.flash = {type:"ok", msg:"Séance enregistrée."}; render();
    });
  const sel = bg.querySelector("[name=sport]"), lbl = bg.querySelector("#distLbl"), dist = bg.querySelector("[name=dist]");
  sel.onchange = () => { const swim = sel.value === "Natation"; lbl.textContent = swim ? "Distance (m)" : "Distance (km)"; dist.step = swim ? "25" : "0.01"; };
}

function importDialog(){
  const bg = modal(`<h2>Importer un fichier</h2>
    <p>Fichier <b>CSV</b> issu de :</p>
    <ul class="sub" style="margin-top:-6px">
      <li><b>Strava</b> : Paramètres › Mon compte › Télécharger ou supprimer votre compte › fichier <i>activities.csv</i> de l’archive ;</li>
      <li><b>Garmin Connect</b> (site web) : Activités › Toutes les activités › Exporter au format CSV ;</li>
      <li>un <b>tableur</b> avec au moins les colonnes <i>Date</i>, <i>Sport</i>, <i>Distance</i> (km, ou m pour la natation) et <i>Durée</i> (hh:mm:ss).</li>
    </ul>
    <p class="tooltip-hint">Les séances déjà présentes ne sont pas dupliquées.</p>
    <div class="actions"><button class="btn" data-x>Annuler</button><button class="btn primary" data-pick>Choisir le fichier…</button></div>`);
  bg.querySelector("[data-pick]").onclick = () => { bg.remove(); $("#fileInput").click(); };
}
$("#fileInput").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  State.busy = true; State.flash = null; render();
  try {
    const rows = parseActivityCsv(await f.text());
    if (!rows.length) throw new Error("Aucune séance reconnue dans ce fichier. Vérifiez qu’il contient au moins les colonnes Date et Sport (ou Type d’activité).");
    const r = await post("/api/activities", {import: rows});
    await reloadMe();
    State.flash = {type:"ok", msg:`${r.imported} séance(s) lue(s) dans ${f.name}. Les doublons éventuels ont été ignorés.`};
  } catch(x){ State.flash = {type:"err", msg:x.message}; }
  finally { State.busy = false; render(); }
});

function passwordDialog(){
  formDialog("Changer mon mot de passe", `
    <label>Mot de passe actuel<input name="current" type="password" autocomplete="current-password" required></label>
    <label><span>Nouveau mot de passe <span class="tooltip-hint">(8 caractères minimum)</span></span><input name="password" type="password" autocomplete="new-password" minlength="8" required></label>`,
    "Enregistrer", async f => { await post("/api/account", {action:"password", ...f}); State.flash = {type:"ok", msg:"Mot de passe modifié."}; render(); });
}
function emailDialog(){
  formDialog("Ajouter un e-mail et un mot de passe", `
    <p class="sub" style="margin:0">Vous pourrez ensuite vous connecter sans Strava.</p>
    <label>Adresse e-mail<input name="email" type="email" autocomplete="email" required></label>
    <label><span>Mot de passe <span class="tooltip-hint">(8 caractères minimum)</span></span><input name="password" type="password" autocomplete="new-password" minlength="8" required></label>`,
    "Enregistrer", async f => { await post("/api/account", {action:"email", ...f}); await reloadMe(); State.flash = {type:"ok", msg:"E-mail et mot de passe enregistrés."}; render(); });
}
async function unlinkDialog(){
  if (!await confirmDialog("Délier Strava ?", "L’accès Strava sera retiré et les activités synchronisées depuis Strava effacées. Vos séances saisies ou importées restent.", "Délier")) return;
  try { await post("/api/account", {action:"unlink_strava"}); await reloadMe(); State.flash = {type:"ok", msg:"Strava a été délié."}; }
  catch(e){ State.flash = {type:"err", msg:e.message}; }
  render();
}
async function deleteDialog(){
  if (!await confirmDialog("Supprimer votre compte ?", "Toutes vos séances seront effacées et l’accès Strava éventuel retiré. Cette action est définitive.", "Supprimer")) return;
  try { await post("/api/account", {action:"delete"}); location.href = "/"; }
  catch(e){ State.flash = {type:"err", msg:e.message}; render(); }
}

try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{ if (State.me) render(); }); } catch(e){}
load();
</script>
</body>
</html>
