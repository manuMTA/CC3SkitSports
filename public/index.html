<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi Triathlon</title>
<meta name="description" content="Connectez Strava et suivez vos volumes de natation, vélo et course à pied.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<header>
  <div class="brand"><span class="logo"><i style="background:var(--swim)"></i><i style="background:var(--bike)"></i><i style="background:var(--run)"></i></span>Suivi Triathlon</div>
  <div id="userArea" class="user-chip"></div>
</header>
<main id="app"><div class="card empty"><span class="spin"></span><p class="sub mt">Chargement…</p></div></main>
<footer>
  <span>Données d’activité fournies par Strava. Chaque utilisateur ne voit que ses propres données.</span>
  <a href="https://www.strava.com/settings/apps" target="_blank" rel="noopener">Gérer les applications connectées à Strava</a>
</footer>

<script src="/dashboard.js"></script>
<script>
"use strict";
const ERRORS = {
  refus: "Vous avez refusé l’autorisation sur Strava. Recommencez si vous souhaitez connecter votre compte.",
  scope: "Pour afficher vos statistiques, cochez l’accès à vos activités lors de l’autorisation Strava.",
  etat: "La connexion a expiré. Merci de recommencer.",
  strava: "Strava a refusé la connexion. Réessayez dans un instant.",
  capacite: "L’application a atteint le nombre maximum d’athlètes autorisé par Strava. Prévenez l’administrateur."
};
const State = { me:null, acts:[], busy:false, flash:null };

function toAct(r){
  const local = String(r.start_date_local||"").replace(/(Z|[+-]\d\d:?\d\d)$/,"");
  return { ts:new Date(local).getTime(), raw:r.sport_type, t:sportOf(r.sport_type), dist:r.distance||0, sec:r.moving_time||0, elev:r.elevation||0, hr:Math.round(r.avg_hr||0), name:r.name||"", id:String(r.id) };
}
async function api(path, opts={}){
  const r = await fetch(path, Object.assign({credentials:"same-origin", headers:{"Content-Type":"application/json"}}, opts));
  const data = await r.json().catch(()=>({}));
  if (!r.ok) { const e = new Error(data.error || "Erreur réseau"); e.status = r.status; throw e; }
  return data;
}

async function load(){
  const q = new URLSearchParams(location.search);
  if (q.get("erreur")) { State.flash = {type:"err", msg: ERRORS[q.get("erreur")] || "La connexion a échoué."}; history.replaceState(null, "", "/"); }
  try {
    const d = await api("/api/me");
    if (!d.connected){ State.me = null; renderLanding(); return; }
    State.me = d; State.acts = d.activities.map(toAct);
    renderUser(); render();
    // Synchro automatique si la dernière date de plus de 3 heures
    const last = d.athlete.last_sync ? new Date(d.athlete.last_sync).getTime() : 0;
    if (Date.now() - last > 3*3600*1000) sync(true);
  } catch(e){
    $("#app").innerHTML = `<div class="card empty"><h1>Service indisponible</h1><p class="sub">${esc(e.message)}</p><div class="actions"><button class="btn" onclick="location.reload()">Réessayer</button></div></div>`;
  }
}

function flashHTML(){
  if (!State.flash) return "";
  return `<div class="note ${State.flash.type==="err"?"err":State.flash.type==="ok"?"ok":""}" style="margin-bottom:16px">${esc(State.flash.msg)}</div>`;
}

function renderLanding(){
  $("#userArea").innerHTML = "";
  $("#app").innerHTML = `${flashHTML()}
  <section class="hero">
    <div class="brand" style="justify-content:center"><span class="logo"><i style="background:var(--swim);height:34px;width:12px"></i><i style="background:var(--bike);height:34px;width:12px"></i><i style="background:var(--run);height:34px;width:12px"></i></span></div>
    <h1>Votre entraînement triathlon, en un coup d’œil</h1>
    <p>Connectez votre compte Strava : vos séances de natation, de vélo et de course sont récupérées automatiquement et transformées en statistiques claires.</p>
    <a class="strava-btn" href="/api/auth/login">Se connecter avec Strava</a>
    <p class="tooltip-hint mt">Accès en lecture seule. Vous pouvez retirer l’autorisation et supprimer vos données à tout moment.</p>
    <div class="features">
      <div><b>Volumes</b><span>Heures et kilomètres par semaine et par discipline.</span></div>
      <div><b>Progression</b><span>Évolution de vos allures en course, natation et vélo.</span></div>
      <div><b>Régularité</b><span>Calendrier de vos jours d’entraînement et records personnels.</span></div>
    </div>
  </section>`;
}

function renderUser(){
  const a = State.me.athlete;
  $("#userArea").innerHTML = `
    ${a.profile && /^https:/.test(a.profile) ? `<img src="${esc(a.profile)}" alt="">` : ""}
    <div class="menu">
      <button class="btn sm" id="menuBtn">${esc(a.firstname || "Mon compte")} ▾</button>
      <div class="menu-panel hidden" id="menuPanel">
        ${State.me.isAdmin ? `<a href="/admin">Administration</a>` : ""}
        <a href="https://www.strava.com/athletes/${a.id}" target="_blank" rel="noopener">Voir mon profil Strava</a>
        <button id="mLogout">Se déconnecter</button>
        <button id="mDelete" class="danger">Supprimer mes données…</button>
      </div>
    </div>`;
  const panel = $("#menuPanel");
  $("#menuBtn").onclick = e => { e.stopPropagation(); panel.classList.toggle("hidden"); };
  document.addEventListener("click", ()=>panel.classList.add("hidden"));
  $("#mLogout").onclick = async ()=>{ await api("/api/auth/logout",{method:"POST"}).catch(()=>{}); location.href = "/"; };
  $("#mDelete").onclick = confirmDeleteAccount;
}

function render(){
  destroyCharts();
  const a = State.me.athlete, acts = State.acts;
  const app = $("#app");
  app.innerHTML = `${flashHTML()}
    <div class="row" style="align-items:flex-end;justify-content:space-between">
      <div>
        <h1>Bonjour ${esc(a.firstname || "")}</h1>
        <p class="sub">${acts.length} activités · dernière synchronisation ${a.last_sync ? dfTime.format(new Date(a.last_sync)) : "–"}</p>
      </div>
      <button class="btn primary" id="bSync" ${State.busy?"disabled":""}>${State.busy?'<span class="spin"></span> Synchronisation…':"Synchroniser Strava"}</button>
    </div>
    <div id="dash"></div>`;
  $("#bSync").onclick = ()=>sync(false);
  if (!acts.length){
    $("#dash").innerHTML = `<div class="card empty mt"><div class="icons"><i style="background:var(--swim)"></i><i style="background:var(--bike)"></i><i style="background:var(--run)"></i></div><h2>Aucune activité pour l’instant</h2><p class="sub">Cliquez sur « Synchroniser Strava ». Si vous venez d’enregistrer une séance, elle apparaîtra dans quelques minutes.</p></div>`;
    return;
  }
  renderDashboard($("#dash"), acts);
}
DS.onChange = render;

async function sync(silent){
  if (State.busy) return;
  State.busy = true; if (!silent) State.flash = null; render();
  try {
    const r = await api("/api/sync", {method:"POST"});
    const d = await api("/api/me");
    if (d.connected){ State.me = d; State.acts = d.activities.map(toAct); }
    if (!silent || r.added) State.flash = {type:"ok", msg: r.skipped ? "Vos données sont déjà à jour." : r.added ? `${r.added} activité(s) récupérée(s) depuis Strava.` : "Aucune nouvelle activité sur Strava."};
  } catch(e){
    if (e.status === 401){ location.href = "/"; return; }
    State.flash = {type:"err", msg:e.message};
  } finally { State.busy = false; render(); }
}

function confirmDeleteAccount(){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal"><h2>Supprimer vos données ?</h2><p>L’autorisation Strava sera retirée et toutes vos activités enregistrées ici seront effacées. Votre compte Strava n’est pas modifié.</p><div class="actions"><button class="btn" data-x>Annuler</button><button class="btn primary" data-ok>Supprimer</button></div></div>`;
  document.body.appendChild(bg);
  bg.querySelector("[data-x]").onclick = ()=>bg.remove();
  bg.onclick = e => { if (e.target===bg) bg.remove(); };
  bg.querySelector("[data-ok]").onclick = async ()=>{
    bg.querySelector("[data-ok]").disabled = true;
    try { await api("/api/account/delete", {method:"POST"}); location.href = "/"; }
    catch(e){ bg.remove(); State.flash = {type:"err", msg:e.message}; render(); }
  };
}

try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{ if (State.me) render(); }); } catch(e){}
load();
</script>
</body>
</html>
