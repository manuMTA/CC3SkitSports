<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — Suivi Triathlon</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<header>
  <div class="brand"><span class="logo"><i style="background:var(--swim)"></i><i style="background:var(--bike)"></i><i style="background:var(--run)"></i></span>Suivi Triathlon · Administration</div>
  <div class="user-chip"><a class="btn sm" href="/">← Mon tableau de bord</a></div>
</header>
<main id="app"><div class="card empty"><span class="spin"></span><p class="sub mt">Chargement…</p></div></main>

<script src="/dashboard.js"></script>
<script>
"use strict";
const A = { users:[], me:null, flash:null, search:"", group:"", detail:null };

async function api(path, opts={}){
  const r = await fetch(path, Object.assign({credentials:"same-origin", headers:{"Content-Type":"application/json"}}, opts));
  const data = await r.json().catch(()=>({}));
  if (!r.ok){ const e = new Error(data.error || "Erreur réseau"); e.status = r.status; throw e; }
  return data;
}
function toAct(r){
  const local = String(r.start_date_local||"").replace(/(Z|[+-]\d\d:?\d\d)$/,"");
  return { ts:new Date(local).getTime(), raw:r.sport_type, t:sportOf(r.sport_type), dist:r.distance||0, sec:r.moving_time||0,
           elev:r.elevation||0, hr:Math.round(r.avg_hr||0), name:r.name||"", uid:r.id, stravaId:"", source:r.source };
}
async function load(){
  try {
    const d = await api("/api/admin");
    A.users = d.users; A.me = d.me; route();
  } catch(e){
    const msg = e.status===401 ? "Connectez-vous d’abord." : e.status===403 ? "Cette page est réservée aux administrateurs." : e.message;
    $("#app").innerHTML = `<div class="card empty"><h1>Accès impossible</h1><p class="sub">${esc(msg)}</p><div class="actions"><a class="btn primary" href="/">Aller à l’accueil</a></div></div>`;
  }
}
const uname = u => [u.firstname, u.lastname].filter(Boolean).join(" ") || u.email || "Utilisateur";
function route(){ const id = location.hash.slice(1); if (id && A.users.some(u=>u.id===id)) openDetail(id); else { A.detail=null; renderList(); } }
window.addEventListener("hashchange", route);

/* ---------- Liste ---------- */
function renderList(){
  destroyCharts();
  const now = Date.now();
  const groups = [...new Set(A.users.map(u=>u.group_name).filter(Boolean))].sort();
  const q = A.search.toLowerCase();
  const list = A.users.filter(u => (!q || (uname(u)+" "+u.email+" "+u.city).toLowerCase().includes(q)) && (!A.group || (A.group==="—" ? !u.group_name : u.group_name===A.group)));
  const new30 = A.users.filter(u=>now-new Date(u.created_at).getTime() < 30*DAY).length;
  const withStrava = A.users.filter(u=>u.has_strava).length;
  $("#app").innerHTML = `${A.flash?`<div class="note ${A.flash.type}" style="margin-bottom:16px">${esc(A.flash.msg)}</div>`:""}
    <h1>Utilisateurs</h1>
    <p class="sub">« Voir » affiche les séances saisies ou importées par l’adhérent. Celles synchronisées depuis Strava restent privées (règles de l’API Strava).</p>
    <div class="grid g4 mt">
      <div class="card kpi"><div class="lbl">Utilisateurs</div><div class="val">${A.users.length}</div><div class="meta">comptes créés</div></div>
      <div class="card kpi"><div class="lbl">Nouveaux (30 jours)</div><div class="val">${new30}</div><div class="meta">inscriptions récentes</div></div>
      <div class="card kpi"><div class="lbl">Strava connecté</div><div class="val">${withStrava}</div><div class="meta">sur ${A.users.length}</div></div>
      <div class="card kpi"><div class="lbl">Groupes</div><div class="val">${groups.length}</div><div class="meta">${groups.slice(0,3).map(esc).join(", ") || "aucun"}</div></div>
    </div>
    <div class="card mt">
      <div class="toolbar" style="margin:0 0 10px">
        <input id="q" class="btn" style="cursor:text;min-width:220px" placeholder="Rechercher un nom, un e-mail…" value="${esc(A.search)}">
        <select id="g" class="btn"><option value="">Tous les groupes</option>${groups.map(g=>`<option ${A.group===g?"selected":""}>${esc(g)}</option>`).join("")}<option value="—" ${A.group==="—"?"selected":""}>Sans groupe</option></select>
        <span class="tooltip-hint">${list.length} affiché(s)</span>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Utilisateur</th><th>Connexion</th><th>Groupe</th><th>Inscrit le</th><th></th></tr></thead>
        <tbody>${list.map(u=>`<tr>
            <td>${u.profile && /^https:/.test(u.profile)?`<img class="avatar" src="${esc(u.profile)}" alt="">`:""}<b>${esc(uname(u))}</b>${u.id===A.me?` <span class="pill">vous</span>`:""}<br><span class="tooltip-hint">${esc(u.email || "pas d’e-mail")}${u.city?" · "+esc(u.city):""}</span></td>
            <td>${u.has_password?`<span class="pill">E-mail</span> `:""}${u.has_strava?`<span class="pill live">Strava</span>`:""}</td>
            <td><input class="group-input" data-id="${u.id}" value="${esc(u.group_name||"")}" placeholder="Ajouter…" list="groups"></td>
            <td>${dfFull.format(new Date(u.created_at))}</td>
            <td style="text-align:right;white-space:nowrap">
              <a class="btn sm" href="#${u.id}">Voir</a>
              ${u.has_password && u.id!==A.me ? `<button class="btn sm" data-reset="${u.id}">Mot de passe</button>` : ""}
              ${u.id===A.me ? "" : `<button class="btn sm danger" data-del="${u.id}">Retirer</button>`}
            </td></tr>`).join("") || `<tr><td colspan="5" class="sub" style="padding:28px;text-align:center">Aucun utilisateur. Partagez l’adresse du site : chaque personne qui crée un compte apparaîtra ici.</td></tr>`}
        </tbody></table></div>
      <datalist id="groups">${groups.map(g=>`<option value="${esc(g)}">`).join("")}</datalist>
    </div>`;
  const qi = $("#q");
  qi.oninput = ()=>{ A.search = qi.value; renderList(); const n=$("#q"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };
  $("#g").onchange = e => { A.group = e.target.value; renderList(); };
  document.querySelectorAll(".group-input").forEach(inp=>{
    inp.onchange = async ()=>{
      const id = inp.dataset.id, v = inp.value.trim();
      try { await api("/api/admin", {method:"PATCH", body:JSON.stringify({id, group_name:v})}); const u=A.users.find(x=>x.id===id); if(u) u.group_name=v; A.flash={type:"ok",msg:"Groupe enregistré."}; }
      catch(e){ A.flash={type:"err",msg:e.message}; }
      renderList();
    };
    inp.onkeydown = e => { if (e.key==="Enter") inp.blur(); };
  });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>confirmDelete(b.dataset.del));
  document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>resetPassword(b.dataset.reset));
}

/* ---------- Fiche adhérent (vue coach) ---------- */
async function openDetail(id){
  destroyCharts();
  $("#app").innerHTML = `<div class="card empty"><span class="spin"></span></div>`;
  try {
    const d = await api("/api/admin?athlete="+encodeURIComponent(id));
    A.detail = {user:d.user, acts:d.activities.map(toAct), hidden:d.hiddenStrava};
    renderDetail();
  } catch(e){ A.flash = {type:"err", msg:e.message}; location.hash = ""; }
}
function renderDetail(){
  destroyCharts();
  const {user:u, acts, hidden} = A.detail;
  $("#app").innerHTML = `<a class="back" href="#" style="text-decoration:none;display:inline-block">← Retour à la liste</a>
    <h1>${esc(uname(u))}${u.group_name?` <span class="pill">${esc(u.group_name)}</span>`:""}</h1>
    <p class="sub">${acts.length} séance(s) saisie(s) ou importée(s)${u.email?" · "+esc(u.email):""}</p>
    ${hidden ? `<p class="note mt">${hidden} activité(s) synchronisée(s) depuis Strava ne sont pas affichées : selon les règles de Strava, elles ne sont visibles que par l’adhérent. Pour les partager avec vous, il peut importer son export Strava (fichier CSV).</p>` : ""}
    <div id="dash"></div>`;
  if (acts.length) renderDashboard($("#dash"), acts);
  else $("#dash").innerHTML = `<div class="card empty mt"><p class="sub">Aucune séance saisie ou importée pour l’instant.</p></div>`;
}
DS.onChange = () => A.detail ? renderDetail() : renderList();

/* ---------- Fenêtres ---------- */
function modal(html){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(bg);
  bg.addEventListener("mousedown", e => { if (e.target===bg) bg.remove(); });
  bg.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>bg.remove());
  return bg;
}
function confirmDelete(id){
  const u = A.users.find(x=>x.id===id); if (!u) return;
  const bg = modal(`<h2>Retirer ${esc(uname(u))} ?</h2><p>Son compte et toutes ses séances seront supprimés de l’application${u.has_strava?", et son accès Strava révoqué (son compte Strava n’est pas touché)":""}.</p><div class="actions"><button class="btn" data-x>Annuler</button><button class="btn primary" data-ok>Retirer</button></div>`);
  bg.querySelector("[data-ok]").onclick = async ()=>{
    bg.remove();
    try { await api("/api/admin?id="+id, {method:"DELETE"}); A.users = A.users.filter(x=>x.id!==id); A.flash={type:"ok",msg:"Utilisateur retiré."}; }
    catch(e){ A.flash={type:"err",msg:e.message}; }
    renderList();
  };
}
function resetPassword(id){
  const u = A.users.find(x=>x.id===id); if (!u) return;
  const bg = modal(`<h2>Réinitialiser le mot de passe de ${esc(uname(u))} ?</h2><p>Un mot de passe provisoire va remplacer l’actuel. Vous le transmettrez à l’adhérent, qui pourra ensuite le changer depuis son menu.</p><div class="actions"><button class="btn" data-x>Annuler</button><button class="btn primary" data-ok>Générer</button></div>`);
  bg.querySelector("[data-ok]").onclick = async ()=>{
    try {
      const r = await api("/api/admin", {method:"POST", body:JSON.stringify({action:"reset_password", id})});
      bg.querySelector(".modal").innerHTML = `<h2>Mot de passe provisoire</h2><p>Pour <b>${esc(u.email)}</b> :</p><div class="temp-pw">${esc(r.password)}</div><p class="tooltip-hint">Notez-le maintenant : il ne sera plus affiché.</p><div class="actions"><button class="btn" data-copy>Copier</button><button class="btn primary" data-x>Fermer</button></div>`;
      bg.querySelector("[data-x]").onclick = () => bg.remove();
      bg.querySelector("[data-copy]").onclick = async e => { try { await navigator.clipboard.writeText(r.password); e.target.textContent = "Copié"; } catch { e.target.textContent = "Sélectionnez-le à la main"; } };
    } catch(e){ bg.remove(); A.flash={type:"err",msg:e.message}; renderList(); }
  };
}
load();
</script>
</body>
</html>
